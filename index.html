<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04060b">
<title>Omad Tour</title>

<!-- PWA — saytni telefon ekraniga "ilova" sifatida o'rnatish uchun -->
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Omad Tour">
<meta name="mobile-web-app-capable" content="yes">

<style>
  /* ===================== THEME TOKENS ===================== */
  :root{
    /* DARK (haqiqiy qora) */
    --bg-1:#04060b;
    --bg-2:#0a0e16;
    --bg-3:#101725;
    --glow-1:rgba(140,160,210,.10);
    --glow-2:rgba(232,53,79,.09);

    --glass:rgba(255,255,255,.055);
    --glass-border:rgba(255,255,255,.13);
    --glass-hover:rgba(255,255,255,.11);

    --text:#eef2f9;
    --text-dim:#9fa9bf;

    --icon:#eef2f9;
    --icon-bg:rgba(255,255,255,.09);

    --surface:#111826;
    --surface-text:#eef2f9;
    --surface-line:rgba(255,255,255,.10);
    --surface-hover:rgba(255,255,255,.08);

    --accent-red:#e8354f;
    --accent-red-dark:#c22440;
    --accent-soft:#ffd0d8;

    --ripple:rgba(255,255,255,.26);
    --shadow:0 10px 30px rgba(0,0,0,.55);
    --shadow-sm:0 4px 14px rgba(0,0,0,.4);

    --radius:20px;

    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  }
  body.theme-light{
    --bg-1:#eef2fb;
    --bg-2:#e2eaf8;
    --bg-3:#d3e0f6;
    --glow-1:rgba(80,120,220,.14);
    --glow-2:rgba(232,53,79,.08);

    --glass:rgba(12,28,77,.05);
    --glass-border:rgba(12,28,77,.14);
    --glass-hover:rgba(12,28,77,.09);

    --text:#0c1c4d;
    --text-dim:#526089;

    --icon:#0c1c4d;
    --icon-bg:rgba(12,28,77,.08);

    --surface:#ffffff;
    --surface-text:#1a2440;
    --surface-line:rgba(12,28,77,.10);
    --surface-hover:rgba(12,28,77,.06);

    --accent-soft:#8a1c30;

    --ripple:rgba(12,28,77,.14);
    --shadow:0 10px 28px rgba(20,40,90,.14);
    --shadow-sm:0 4px 12px rgba(20,40,90,.12);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg-1);}
  body{
    color:var(--text);
    background:
      radial-gradient(900px 600px at 15% -8%, var(--glow-1), transparent 60%),
      radial-gradient(800px 560px at 95% 108%, var(--glow-2), transparent 60%),
      linear-gradient(180deg, var(--bg-3) 0%, var(--bg-2) 45%, var(--bg-1) 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    transition:background-color .25s ease,color .25s ease;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important;}
  }

  #dots-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}

  #app{
    position:relative;z-index:1;height:100dvh;width:100vw;max-width:520px;margin:0 auto;
    display:flex;flex-direction:column;overflow:hidden;
  }
  @media (min-width:900px){
    body{display:flex;align-items:center;justify-content:center;}
    #app{
      max-width:1000px;height:88vh;max-height:900px;
      border-radius:28px;box-shadow:var(--shadow);
      border:1px solid var(--glass-border);
    }
    .home-scroll{padding:0 6vw;}
    .menu-list{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .greeting{font-size:19px;max-width:640px;margin-left:auto;margin-right:auto;}
    .screen{padding-left:8vw;padding-right:8vw;}
  }

  .screen{
    position:absolute;inset:0;display:none;flex-direction:column;
    padding:max(16px,env(safe-area-inset-top)) 18px 28px;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .screen.active{display:flex;}

  .topbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;min-height:40px;}
  .topbar .spacer{flex:1;}

  .back-btn{
    background:var(--accent-red);color:#fff;border:none;border-radius:14px;
    padding:9px 16px;font-size:15px;font-weight:600;cursor:pointer;
    box-shadow:0 4px 14px rgba(232,53,79,.32);
    display:inline-flex;align-items:center;gap:6px;
  }
  .back-btn:active{background:var(--accent-red-dark);transform:translateY(1px);}

  .lang-switch{display:flex;gap:6px;}
  .lang-btn{
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:var(--text);border-radius:12px;padding:7px 10px;font-size:13px;font-weight:700;
    cursor:pointer;letter-spacing:.02em;
  }
  .lang-btn.active{background:var(--glass-hover);border-color:var(--text-dim);}

  .icon-btn{
    position:relative;background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:var(--icon);border-radius:13px;padding:10px 13px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .icon-btn svg{width:23px;height:23px;display:block;}
  .icon-btn .badge{
    position:absolute;top:-6px;right:-6px;background:var(--accent-red);color:#fff;
    font-size:10.5px;font-weight:800;border-radius:10px;min-width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }

  .logo-wrap{display:flex;justify-content:center;margin:4px 0 16px;}

  .hours-badge{
    display:flex;align-items:center;justify-content:center;gap:7px;
    margin:2px auto 6px;padding:7px 14px;border-radius:20px;width:fit-content;
    font-size:12.5px;font-weight:700;
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  }
  .hours-badge.open{color:#1c9a5b;}
  .hours-badge.closed{color:var(--accent-red);}
  .hours-dot{
    width:7px;height:7px;border-radius:50%;flex-shrink:0;
    animation:hoursDotPulse 1.8s ease-in-out infinite;
  }
  .hours-badge.open .hours-dot{background:#22c076;}
  .hours-badge.closed .hours-dot{background:var(--accent-red);}
  @keyframes hoursDotPulse{0%,100%{opacity:1;}50%{opacity:.4;}}

  .install-banner{
    display:flex;align-items:center;gap:10px;
    margin:0 0 16px;padding:11px 12px;border-radius:14px;
    background:rgba(232,53,79,.09);border:1px solid rgba(232,53,79,.3);
    animation:fadeUp .4s ease;
  }
  .install-banner-icon{font-size:19px;flex-shrink:0;}
  .install-banner-text{flex:1;font-size:12.5px;line-height:1.4;font-weight:600;color:var(--text);}
  .install-banner-btn{
    flex-shrink:0;background:var(--accent-red);color:#fff;border:none;border-radius:10px;
    padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .install-banner-close{
    flex-shrink:0;background:none;border:none;color:var(--text-dim);
    font-size:15px;cursor:pointer;padding:2px 4px;line-height:1;
  }

  .logo-circle{
    width:132px;height:132px;border-radius:50%;overflow:hidden;
    border:3px solid rgba(232,53,79,.5);
    box-shadow:var(--shadow);
    background:#fdfdff;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .logo-circle img{width:100%;height:100%;object-fit:contain;}

  .greeting{
    text-align:center;font-size:16px;line-height:1.55;margin:0 6px 22px;font-weight:600;
    color:var(--text);
  }

  .home-scroll{flex:1;display:flex;flex-direction:column;overflow-y:auto;}
  .menu-list{display:flex;flex-direction:column;gap:12px;margin-top:auto;margin-bottom:6px;}

  .glass-btn{
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    color:var(--text);border-radius:var(--radius);
    padding:15px 16px;font-size:16px;font-weight:600;
    display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;
    text-decoration:none;
    transition:background .15s ease,transform .1s ease;
    box-shadow:var(--shadow-sm);
    position:relative;overflow:hidden;width:100%;
    font-family:inherit;
  }
  .glass-btn:active{background:var(--glass-hover);transform:translateY(1px);}
  .glass-btn:focus-visible{outline:2px solid var(--accent-red);outline-offset:2px;}
  .glass-btn .label{flex:1;min-width:0;}
  .glass-btn .arrow{opacity:.55;font-size:18px;flex-shrink:0;}
  .glass-btn .label-col{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
  .glass-btn .label-col .label{font-size:16px;font-weight:700;}
  .glass-btn .label-col .sub{font-size:12px;font-weight:500;color:var(--text-dim);line-height:1.35;}
  .glass-btn::before{
    content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;
    background:var(--accent-c,transparent);
  }
  .accent-1{--accent-c:#4fa8ff;}
  .accent-2{--accent-c:#f5b52e;}
  .accent-3{--accent-c:#2fc9a8;}
  .accent-4{--accent-c:#a97bff;}
  .accent-5{--accent-c:#ff6f9c;}
  .accent-6{--accent-c:#48d67a;}

  .glass-btn-red{background:rgba(232,53,79,.13);border-color:rgba(232,53,79,.45);}
  .glass-btn-red::before{background:var(--accent-red);}
  .glass-btn-red:active{background:rgba(232,53,79,.22);}

  .stepper{display:flex;align-items:center;gap:14px;flex-shrink:0;}
  .stepper-btn{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--glass-border);
    background:var(--glass-hover);color:var(--text);font-size:19px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-family:inherit;line-height:1;padding:0;
  }
  .stepper-btn:active{background:var(--accent-red);border-color:var(--accent-red);color:#fff;}
  .stepper-count{font-size:17px;font-weight:700;min-width:20px;text-align:center;}

  .trip-toggle{display:flex;gap:10px;margin-bottom:20px;}
  .trip-toggle-btn{
    flex:1;padding:14px 10px;border-radius:16px;
    border:1.5px solid var(--glass-border);background:var(--glass);
    text-align:center;font-weight:700;font-size:15px;color:var(--text);
    cursor:pointer;font-family:inherit;transition:border-color .15s,color .15s,background .15s;
  }
  .trip-toggle-btn.selected{
    border-color:var(--accent-red);color:var(--accent-red);
    background:rgba(232,53,79,.09);
  }

  .ripple{
    position:absolute;border-radius:50%;background:var(--ripple);
    transform:scale(0);animation:rippleAnim .55s ease-out;pointer-events:none;
  }
  @keyframes rippleAnim{to{transform:scale(2.6);opacity:0;}}

  .icon-circle{
    width:46px;height:46px;border-radius:50%;background:var(--icon-bg);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--icon);
  }
  .icon-circle svg{width:24px;height:24px;display:block;}
  .inline-icon{display:inline-flex;width:21px;height:21px;vertical-align:-5px;color:var(--icon);}
  .inline-icon svg{width:100%;height:100%;}

  h2.title{font-size:18px;margin:0 0 14px;font-weight:700;text-align:center;letter-spacing:.01em;}

  .section-text{
    font-size:14.5px;line-height:1.6;color:var(--text-dim);
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:16px;padding:14px 16px;margin-bottom:18px;
  }
  .list-col{display:flex;flex-direction:column;gap:10px;}
  .airport-sub{display:flex;flex-direction:column;gap:8px;margin:4px 0 4px 14px;}
  .airport-sub .glass-btn{padding:11px 14px;font-size:14px;}

  input[type="text"],input[type="tel"],textarea{
    width:100%;background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:14px;color:var(--text);padding:15px 14px;font-size:17px;font-weight:600;
    margin-bottom:6px;font-family:inherit;
  }
  input:focus,textarea:focus{outline:none;border-color:var(--accent-red);}
  textarea{min-height:120px;resize:vertical;font-weight:500;font-size:15.5px;}
  input::placeholder,textarea::placeholder{color:var(--text-dim);opacity:.75;font-weight:500;}
  .required-star{color:var(--accent-red);font-weight:800;margin-left:4px;}
  .field-label{font-size:14px;font-weight:600;margin:12px 0 6px;}
  .error-msg{color:var(--accent-red);font-size:12.5px;margin:-2px 0 10px;display:none;}

  .phone-input-wrap{position:relative;}
  .phone-input-row{display:flex;gap:8px;}
  .phone-country-btn{
    flex-shrink:0;display:flex;align-items:center;gap:6px;
    background:var(--surface);border:1px solid var(--glass-border);
    border-radius:12px;padding:0 12px;cursor:pointer;font-family:inherit;
    color:var(--text);font-size:15px;font-weight:700;
  }
  .phone-flag{font-size:19px;}
  .phone-caret{font-size:10px;color:var(--text-dim);margin-left:2px;}
  .phone-number-input{
    flex:1;min-width:0;background:var(--surface);border:1px solid var(--glass-border);
    border-radius:12px;color:var(--text);padding:12px;font-size:15px;font-weight:600;
    font-family:inherit;
  }
  .phone-country-list{
    position:absolute;bottom:calc(100% + 6px);left:0;z-index:20;
    display:flex;flex-direction:column;width:100%;max-width:280px;
    background:var(--bg-2);border:1px solid var(--glass-border);border-radius:14px;
    box-shadow:0 -8px 24px rgba(0,0,0,.25);overflow:hidden;
  }
  .phone-country-opt{
    display:flex;align-items:center;gap:8px;padding:12px 14px;
    background:none;border:none;border-bottom:1px solid var(--glass-border);
    color:var(--text);font-size:14px;font-weight:600;font-family:inherit;
    cursor:pointer;text-align:left;
  }
  .phone-country-opt:last-child{border-bottom:none;}
  .phone-country-code{margin-left:auto;color:var(--text-dim);font-weight:700;}

  .upload-box{
    width:100%;min-height:108px;background:var(--glass);
    border:2px dashed var(--glass-border);border-radius:16px;margin-bottom:6px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s;
  }
  .upload-box:active{background:var(--glass-hover);}
  .upload-box.ready{border-style:solid;border-color:rgba(60,200,120,.55);}
  .upload-box.failed{border-color:rgba(232,53,79,.6);}
  .upload-empty{
    display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text-dim);
    font-size:14px;font-weight:600;padding:20px;text-align:center;
  }
  .upload-empty svg{width:28px;height:28px;opacity:.8;}
  .upload-preview{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;}
  .upload-preview img{
    width:60px;height:60px;object-fit:cover;border-radius:10px;
    border:1px solid var(--glass-border);flex-shrink:0;
  }
  .upload-info{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;}
  .upload-info .fname{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .upload-meta{font-size:12px;color:var(--text-dim);}
  .upload-meta.ok{color:#3ec27a;font-weight:700;}
  .upload-meta.err{color:var(--accent-red);font-weight:700;}
  .upload-detail{
    display:block;font-size:11px;color:var(--text-dim);margin-top:2px;
    line-height:1.4;word-break:break-word;font-family:ui-monospace,Consolas,monospace;
  }
  .ocr-status{
    font-size:12.5px;font-weight:600;padding:9px 12px;border-radius:10px;margin:8px 0 4px;
    background:var(--glass);border:1px solid var(--glass-border);
  }
  .ocr-status.working{color:var(--text-dim);}
  .ocr-status.ok{color:#1c9a5b;background:rgba(34,192,118,.1);border-color:rgba(34,192,118,.3);}
  .ocr-status.empty{color:var(--text-dim);}
  .upload-remove{
    background:var(--accent-red);color:#fff;border:none;border-radius:50%;
    width:26px;height:26px;font-size:13px;cursor:pointer;flex-shrink:0;line-height:1;
  }
  .upload-bar{height:3px;border-radius:3px;background:var(--glass-border);overflow:hidden;margin-top:5px;}
  .upload-bar span{display:block;height:100%;width:0;background:var(--accent-red);transition:width .3s ease;}

  .primary-btn{
    background:var(--accent-red);color:#fff;border:none;border-radius:16px;width:100%;
    padding:15px;font-size:15.5px;font-weight:700;cursor:pointer;font-family:inherit;
    box-shadow:0 6px 18px rgba(232,53,79,.32);margin-top:6px;
  }
  .primary-btn:active{background:var(--accent-red-dark);}
  .primary-btn:disabled{opacity:.55;cursor:default;}

  .attention-pulse{
    text-align:left;font-weight:600;font-size:14px;line-height:1.55;
    color:var(--accent-soft);
    padding:14px 16px;margin-bottom:16px;border-radius:14px;
    background:rgba(232,53,79,.11);border:1px solid rgba(232,53,79,.38);
    animation:attentionGlow 2.4s ease-in-out infinite;
  }
  .attention-pulse b{color:var(--accent-red);font-weight:800;}
  /* Butun matn xiralashib turmasligi uchun — faqat chegara va soya
     "nafas oladi", matn esa doim to'liq o'qiladigan bo'lib qoladi. */
  @keyframes attentionGlow{
    0%,100%{ box-shadow:0 0 0 0 rgba(232,53,79,.28); border-color:rgba(232,53,79,.38); }
    50%    { box-shadow:0 0 0 6px rgba(232,53,79,0); border-color:rgba(232,53,79,.75); }
  }

  /* Calendar */
  .calendar-card{
    background:var(--surface);color:var(--surface-text);
    border:1px solid var(--surface-line);
    border-radius:22px;padding:16px;box-shadow:var(--shadow);
  }
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-nav-btn{
    background:var(--surface-hover);border:none;font-size:20px;color:var(--surface-text);
    cursor:pointer;padding:4px 12px;border-radius:10px;line-height:1.2;
  }
  .cal-month-label{font-weight:700;font-size:15.5px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
  .cal-dow{font-size:11.5px;color:var(--text-dim);font-weight:700;padding:4px 0;}
  .cal-day{padding:10px 0;border-radius:10px;font-size:14px;cursor:pointer;}
  .cal-day.empty{visibility:hidden;}
  .cal-day:active{background:var(--surface-hover);}
  .cal-day.today{border:1px solid var(--accent-red);}
  .cal-day.selected{background:var(--accent-red);color:#fff;font-weight:700;}
  .cal-day.past{opacity:.28;pointer-events:none;}

  .contact-summary{
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:16px;padding:14px;margin-bottom:16px;font-size:14.5px;line-height:1.65;
  }
  .addr-block{
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:16px;padding:14px 16px;margin-bottom:16px;font-size:14.5px;line-height:1.6;
    animation:fadeUp .45s ease;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .office-map{
    margin-top:12px;border-radius:14px;overflow:hidden;
    border:1px solid var(--glass-border);
    background:var(--surface-hover);
    height:200px;width:100%;
  }
  .office-map .leaflet-container{background:var(--surface-hover);font-family:inherit;}

  /* Avtomatik slayd-shou — ofis va kirish joyi fotolari */
  .office-slideshow{
    margin-top:12px;border-radius:14px;overflow:hidden;position:relative;
    border:1px solid var(--glass-border);background:#000;
    height:200px;width:100%;
  }
  .office-slide{
    position:absolute;inset:0;background-size:cover;background-position:center;
    will-change:transform;
  }
  .office-slide-dots{
    position:absolute;bottom:9px;left:0;right:0;z-index:5;
    display:flex;justify-content:center;gap:5px;
  }
  .office-slide-dot{
    width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45);
    transition:background .2s, transform .2s;
  }
  .office-slide-dot.active{background:#fff;transform:scale(1.3);}
  .office-route-status{
    margin-top:8px;font-size:13px;font-weight:600;color:var(--text-dim);

  .news-row-text{flex:1;min-width:0;overflow:hidden;}

  .img-zoom-overlay{

  .notary-list{display:flex;flex-direction:column;gap:2px;margin-bottom:6px;}
  .notary-item{
    display:flex;align-items:flex-start;gap:11px;padding:11px 12px;

    background:var(--glass);border:1px solid var(--glass-border);
    margin-bottom:7px;transition:border-color .15s,background .15s;
  }
  .notary-item input{position:absolute;opacity:0;width:0;height:0;}
  .notary-box{
    width:21px;height:21px;border-radius:6px;flex-shrink:0;margin-top:1px;
    border:2px solid var(--glass-border);background:var(--surface);
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,border-color .15s;
  }
  .notary-box::after{
    content:"✓";color:#fff;font-size:13px;font-weight:900;opacity:0;transition:opacity .12s;
  }
  .notary-item input:checked ~ .notary-box{background:var(--accent-red);border-color:var(--accent-red);}
  .notary-item input:checked ~ .notary-box::after{opacity:1;}
  .notary-item input:checked ~ .notary-name{color:var(--text);font-weight:700;}
  .notary-item:has(input:checked){border-color:rgba(232,53,79,.45);background:rgba(232,53,79,.07);}
  .notary-name{font-size:13.5px;line-height:1.45;color:var(--text-dim);flex:1;}
  .notary-summary{
    margin:0;font-size:13px;line-height:1.55;color:var(--text);
    white-space:pre-wrap;word-break:break-word;font-family:inherit;
  }

  .push-cta{
    display:flex;align-items:center;gap:12px;width:100%;
    margin:0 0 16px;padding:13px 14px;border-radius:16px;text-align:left;
    background:rgba(232,53,79,.09);border:1.5px solid rgba(232,53,79,.35);
    cursor:pointer;font-family:inherit;
    animation:fadeUp .4s ease;
  }

  .push-cta-icon{font-size:22px;flex-shrink:0;}
  .push-cta-text{display:flex;flex-direction:column;gap:2px;min-width:0;}

  .push-cta-text span{font-size:12px;line-height:1.4;color:var(--text-dim);}

    margin-top:5px;font-size:10.5px;line-height:1.4;
    font-family:ui-monospace,Consolas,monospace;
    color:var(--accent-red);opacity:.9;word-break:break-word;
  }
  .steps-row{
    display:flex;align-items:flex-start;justify-content:space-between;
    margin:0 0 14px;gap:2px;
  }
  .step{display:flex;flex-direction:column;align-items:center;gap:5px;flex-shrink:0;width:74px;}
  .step-dot{
    width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;
    background:var(--surface-hover);color:var(--text-dim);
    border:1.5px solid var(--glass-border);
  }
  .step.done .step-dot{background:#22c076;color:#fff;border-color:#22c076;}
  .step.active .step-dot{
    background:var(--accent-red);color:#fff;border-color:var(--accent-red);
    animation:stepPulse 1.8s ease-in-out infinite;
  }
  @keyframes stepPulse{0%,100%{box-shadow:0 0 0 0 rgba(232,53,79,.45);}50%{box-shadow:0 0 0 7px rgba(232,53,79,0);}}
  .step-label{font-size:10.5px;font-weight:700;text-align:center;line-height:1.25;color:var(--text-dim);}
  .step.done .step-label,.step.active .step-label{color:var(--text);}
  .step-line{flex:1;height:2px;background:var(--glass-border);margin-top:12px;border-radius:2px;}
  .step-line.done{background:#22c076;}
  .status-code{
    margin-top:8px;font-size:13px;color:var(--text-dim);
    word-break:break-all;
  }
  .status-card{
    border-radius:16px;padding:16px;margin-bottom:14px;font-size:14.5px;line-height:1.6;
    border:1px solid var(--glass-border);
  }
  .status-card p{margin:8px 0 0;}
  .status-card-ready{background:rgba(60,200,120,.12);border-color:rgba(60,200,120,.4);}
  .status-card-pending{background:rgba(232,53,79,.1);border-color:rgba(232,53,79,.35);}
  .status-card-new{background:rgba(245,181,46,.1);border-color:rgba(245,181,46,.35);}

  .inapp-warning{
    background:rgba(245,181,46,.12);border:1px solid rgba(245,181,46,.42);
    border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:13px;line-height:1.55;color:var(--text);
  }

  .story-overlay{
    position:fixed;inset:0;z-index:50;background:#000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    animation:storyFadeIn .2s ease;
  }
  @keyframes storyFadeIn{from{opacity:0;}to{opacity:1;}}
  .story-progress{
    position:absolute;top:14px;left:12px;right:12px;height:3px;
    background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden;z-index:2;
  }
  .story-progress span{display:block;height:100%;width:0;background:#fff;border-radius:3px;transition:width 5s linear;}
  .story-close{
    position:absolute;top:26px;left:14px;z-index:2;background:rgba(255,255,255,.18);
    color:#fff;border:none;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;
  }
  .story-img{max-width:100%;max-height:76vh;object-fit:contain;}
  .story-noimg{width:76px;height:76px;color:#fff;opacity:.75;}
  .story-noimg svg{width:100%;height:100%;}
  .story-caption{
    color:#fff;font-size:15px;line-height:1.55;text-align:center;
    padding:60px 24px 22px;max-width:520px;
    background:linear-gradient(0deg,rgba(0,0,0,.72),transparent);
    position:absolute;bottom:0;left:0;right:0;
  }

  .fly-plane{
    position:fixed;top:9%;left:-10%;z-index:0;pointer-events:none;
    width:24px;height:24px;color:var(--text);opacity:.28;
    animation:flyAcross 22s linear infinite;
  }
  @keyframes flyAcross{
    0%{transform:translate(0,0) rotate(24deg);opacity:0;}
    10%{opacity:.28;}
    90%{opacity:.28;}
    100%{transform:translate(130vw,48vh) rotate(24deg);opacity:0;}
  }

  /* An'anaviy naqsh — HAR IKKALA rejimda ham bir xil aniq ko'rinishi kerak.
     Qorong'i fonda och rangli chiziq xiraroq ko'rinadi, shuning uchun u
     yerda shaffoflik oshiriladi; yorug' fonda esa aksincha, past bo'ladi.
     Shu tufayli fon almashganda naqsh "yo'qolib qolmaydi". */
  .corner-ornament{
    position:fixed;z-index:0;pointer-events:none;
    width:300px;height:300px;color:var(--text);opacity:.16;
  }
  .corner-ornament.tl{top:-86px;left:-86px;}
  .corner-ornament.br{bottom:-86px;right:-86px;transform:rotate(180deg);}
  body.theme-light .corner-ornament{opacity:.08;}

  /* An'anaviy "girih" panjara — butun fonni yengil qoplaydi */
  .girih-layer{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    color:var(--text);opacity:.075;
  }
  body.theme-light .girih-layer{opacity:.04;}

  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:10px;}

<!-- Leaflet — manzillar bo'limidagi xaritani va yo'l chizig'ini SAYT ICHIDA

     mijozning telefonida, TO'LIQ BEPUL o'qib olish uchun — ZAXIRA sifatida,
     agar shtrix-kodning o'zini dekodlash muvaffaqiyatsiz bo'lsa. Bu —

<script>
/* =========================================================

   ---------------------------------------------------------

const VAPID_PUBLIC_KEY = "BGaR19UdkWEqZzYNaCkCYg71XdYUPgMtbIP1y3jMdhtElVOGsZ-7SRwvKnAyNmAdNEJ7uHdUeh9Cm_SdzhtvjeM";
function urlBase64ToUint8Array(base64String){
  const padding = "=".repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
  const raw = atob(base64);
  const out = new Uint8Array(raw.length);
  for(let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

/* Push obunasi. `submissionId` berilsa — o'sha viza so'roviga bog'lanadi
   (holat o'zgarganda shaxsiy xabar keladi). Berilmasa ham obuna saqlanadi
   va UMUMIY e'lonlar (yangiliklar) shu qurilmaga yetib boradi.

   MUHIM: har bir qadamda vaqt chegarasi bor — agar biror narsa javob
   bermasa, tugma "…" holatida CHEKSIZ qotib qolmaydi, balki aniq sabab
   qaytariladi. Natija: { ok: true } yoki { ok: false, reason: "..." } */
function withTimeout(promise, ms, reasonOnTimeout){
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(()=> reject(new Error(reasonOnTimeout)), ms))
  ]);
}
async function subscribeToPush(submissionId){
  try{
    if(!("serviceWorker" in navigator)) return { ok:false, reason:"noSW" };
    if(!("PushManager" in window)) return { ok:false, reason:"noPush" };
    if(typeof Notification === "undefined") return { ok:false, reason:"noNotif" };

    // iOS'da bu faqat sayt "Bosh ekranga qo'shish" orqali o'rnatilgan
    // bo'lsa ishlaydi — aks holda brauzer buni butunlay rad etadi.
    if(Notification.permission === "denied") return { ok:false, reason:"denied" };

    const perm = await withTimeout(Notification.requestPermission(), 30000, "permTimeout");
    if(perm !== "granted") return { ok:false, reason: perm === "denied" ? "denied" : "dismissed" };

    // Service Worker ro'yxatdan o'tmagan bo'lsa, `ready` CHEKSIZ kutadi —
    // shuning uchun avval o'zimiz ro'yxatdan o'tkazamiz, so'ng vaqt
    // chegarasi bilan kutamiz.
    let reg = null;
    try{
      reg = await withTimeout(navigator.serviceWorker.register("/sw.js"), 6000, "swRegTimeout");
    }catch(e){ /* allaqachon ro'yxatdan o'tgan bo'lishi mumkin */ }
    try{
      reg = await withTimeout(navigator.serviceWorker.ready, 6000, "swReadyTimeout");
    }catch(e){
      return { ok:false, reason:"swNotReady" };
    }
    if(!reg || !reg.pushManager) return { ok:false, reason:"noPushManager" };

    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      try{
        sub = await withTimeout(reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        }), 12000, "subscribeTimeout");
      }catch(e){
        return { ok:false, reason:"subscribeFailed" };
      }
    }

    const res = await request("/api/push-subscribe", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ submissionId: submissionId || null, subscription: sub.toJSON ? sub.toJSON() : sub })
    }, { timeout:12000, attempts:2 });
    const data = await res.json().catch(()=> null);
    if(data && data.ok){
      store.set("omad_push_on", "1");
      return { ok:true };
    }
    return { ok:false, reason:"serverError" };
  }catch(e){
    return { ok:false, reason:"unknown" };
  }
}
/* Obuna holatini tekshirish — tugmani to'g'ri ko'rsatish uchun.
   Bu ham hech qachon qotib qolmasligi kerak (vaqt chegarasi bilan). */
async function isPushSubscribed(){
  try{
    if(!("serviceWorker" in navigator) || !("PushManager" in window)) return false;
    if(typeof Notification === "undefined" || Notification.permission !== "granted") return false;
    const reg = await withTimeout(navigator.serviceWorker.ready, 6000, "t").catch(()=> null);
    if(!reg || !reg.pushManager) return false;
    const sub = await reg.pushManager.getSubscription();
    return !!sub;
  }catch(e){ return false; }
}

function getSPBTimeParts(){
  const parts = new Intl.DateTimeFormat("en-GB", {
    timeZone: "Europe/Moscow", hour:"2-digit", minute:"2-digit", hour12:false
  }).formatToParts(new Date());
  const h = parseInt(parts.find(p=>p.type==="hour").value, 10);
  const m = parseInt(parts.find(p=>p.type==="minute").value, 10);
  return { h, m };
}

/* ================== TARMOQ ================== */
async function request(url, opts, { timeout = 30000, attempts = 2 } = {}){
  let lastErr;
  for(let i = 0; i < attempts; i++){
    const ctrl = new AbortController();
    const timer = setTimeout(()=> ctrl.abort(), timeout);
    try{
      const res = await fetch(url, Object.assign({ cache:"no-store", signal: ctrl.signal }, opts || {}));
      clearTimeout(timer);
      return res;
    }catch(e){
      clearTimeout(timer);
      lastErr = e;
      if(i < attempts - 1) await new Promise(r => setTimeout(r, 500 * (i + 1)));
    }
  }
  throw lastErr;
}

/* ================== RASM: SIQISH + YUKLASH ================== */
/* Vercel so'rov tanasi ~4.5MB bilan cheklangan, base64 esa hajmni ~33% oshiradi.
   Nishonlangan hajmni ilgarigidan taxminan yarmiga tushirdik — hujjat matni
   hamon aniq o'qiladi, lekin siqish va yuklash sezilarli tezlashadi. */
const TARGET_B64 = 550000;

function loadImage(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}
function toJpeg(img, maxDim, quality){
  let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  if(Math.max(w,h) > maxDim){
    if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
    else{ w = Math.round(w * maxDim / h); h = maxDim; }
  }
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
  ctx.drawImage(img, 0, 0, w, h);
  return c.toDataURL("image/jpeg", quality);
}
async function compressImage(file){
  const img = await loadImage(file);
  const ladder = [[1300,.72],[1100,.68],[950,.6],[800,.52],[650,.46],[500,.4]];
  let out = toJpeg(img, ladder[0][0], ladder[0][1]);
  for(let i = 1; i < ladder.length && out.length > TARGET_B64; i++){
    out = toJpeg(img, ladder[i][0], ladder[i][1]);
  }
  return out;
}
async function uploadBase64(base64){
  let res;
  try{
    res = await request("/api/upload-image", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ imageBase64: base64 })
    }, { timeout:60000, attempts:3 });
  }catch(e){
    // Fetch o'zi butunlay muvaffaqiyatsiz bo'ldi (masalan internet uzildi,
    // yoki server umuman javob bermadi) — texnik sababini aniq ko'rsatamiz.
    throw new Error("Tarmoq xatosi: " + String(e && e.message || e));
  }
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(res.ok && data && data.url) return data.url;
  const serverMsg = (data && (data.error || data.details)) ? JSON.stringify(data.error || data.details) : null;
  throw new Error(serverMsg || ("Server javobi: HTTP " + res.status));
}

/* Fayl tanlangan zahoti siqish va yuklash boshlanadi — "Yuborish" bosilganda
   kutish bo'lmaydi (yashil ✓ belgisi allaqachon tayyor bo'lib turadi).
   Siqilgan base64 ham keshda saqlanadi — Telegramga jo'natishda uni
   qaytadan siqishga hojat qolmaydi, shu bilan tezlik ta'minlanadi. */
function createUploader(onStatus){
  const u = { file:null, url:null, base64:null, status:"idle", promise:null, error:"" };
  function start(){
    u.status = "working"; u.url = null; u.base64 = null; u.error = "";
    onStatus("working");
    u.promise = (async ()=>{
      let base64;
      try{ base64 = await compressImage(u.file); }
      catch(e){
        base64 = await new Promise((res, rej)=>{
          const r = new FileReader();
          r.onload = ()=> res(r.result); r.onerror = rej; r.readAsDataURL(u.file);
        });
      }
      u.base64 = base64;
      return await uploadBase64(base64);
    })();
    u.promise
      .then(url => { u.url = url; u.status = "done"; onStatus("done"); })
      .catch(e => {
        u.status = "failed";
        u.error = String(e && e.message || e);
        onStatus("failed", u.error);
      });
    return u.promise;
  }
  u.setFile = (file)=>{ u.file = file; start().catch(()=>{}); };
  u.clear = ()=>{ u.file = null; u.url = null; u.base64 = null; u.status = "idle"; u.promise = null; onStatus("idle"); };
  u.retry = ()=>{ if(u.file) start().catch(()=>{}); };
  u.resolve = async ()=>{
    if(!u.file) return null;
    if(u.status === "done") return u.url;
    if(u.status === "working") return await u.promise;
    return await start();
  };
  return u;
}

async function updateVisaImage(id, imageUrl){
  if(!imageUrl) return false;
  const list = (await fetchVisa()).slice();
  const idx = list.findIndex(v => v.id === id);
  if(idx === -1) return false;
  list[idx] = Object.assign({}, list[idx], { imageUrl });
  const r = await kvSet("visa_submissions", list);
  return !!r.ok;
}

/* ================== NAVIGATSIYA ================== */
function go(name, opts){ navStack.push({ name, opts: opts || {} }); render(); }
function back(){ if(navStack.length > 1){ navStack.pop(); render(); } }
function home(){ navStack = [{ name:"home", opts:{} }]; render(); }
function setLang(l){ LANG = l; store.set("omad_lang", l); render(); }
function applyTheme(){
  document.body.classList.toggle("theme-light", THEME === "light");
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", THEME === "light" ? "#eef2fb" : "#04060b");
}
function toggleTheme(){
  THEME = THEME === "dark" ? "light" : "dark";
  store.set("omad_theme", THEME);
  applyTheme(); render();
}

function render(){
  const cur = navStack[navStack.length - 1];
  const app = document.getElementById("app");
  app.innerHTML = screenHTML(cur.name, cur.opts);
  app.scrollTop = 0;
  bind(cur.name, cur.opts);
}

  return `<div class="lang-switch">

function screenHTML(name, opts){
  switch(name){
    case "home": return homeScreen();
    case "aviaMenu": return aviaMenuScreen();
    case "cityStep": return cityStepScreen(opts);
    case "otherCountry": return otherCountryScreen(opts);
    case "calendar": return calendarScreen(opts);
    case "passengers": return passengersScreen();
    case "contact": return contactScreen();
    case "tourServices": return tourServicesScreen();
    case "viza": return vizaScreen();
    case "vizaForm": return vizaFormScreen();
    case "myVisaStatus": return myVisaStatusScreen();
    case "notarial": return notarialScreen();
    case "notaryOrder": return notaryOrderScreen(opts);
    case "notaryContact": return notaryContactScreen(opts);
    case "groups": return groupsScreen();
    case "addresses": return addressesScreen();
    case "help": return helpScreen();
    case "news": return newsScreen();
    case "admin": return adminScreen();
    default: return homeScreen();
  }
}

function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function calendarInner(mode){
  const y = state.calYear, m = state.calMonth;
  const offset = (new Date(y,m,1).getDay() + 6) % 7;
  const total = daysInMonth(y,m);
  const today = new Date(); today.setHours(0,0,0,0);
  const minDate = mode === "return" && state.date ? state.date : today;
  const selectedDate = mode === "return" ? state.returnDate : state.date;
  let cells = "";
  for(let i=0;i<offset;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=total; d++){
    const dt = new Date(y,m,d);
    const past = dt < minDate;
    const isToday = dt.getTime() === today.getTime();
    const sel = selectedDate && selectedDate.getFullYear()===y && selectedDate.getMonth()===m && selectedDate.getDate()===d;
    cells += `<div class="cal-day${past?' past':''}${isToday?' today':''}${sel?' selected':''}" data-day="${d}">${d}</div>`;
  }
  const dow = t('dow').map(d => `<div class="cal-dow">${d}</div>`).join("");
  return `<div class="cal-head">
      <button class="cal-nav-btn" id="prevMonth" aria-label="prev">‹</button>
      <div class="cal-month-label">${t('mon')[m]} ${y}</div>
      <button class="cal-nav-btn" id="nextMonth" aria-label="next">›</button>
    </div>
    <div class="cal-grid">${dow}${cells}</div>`;
}

function summaryText(){
  const from = state.direction === "other" ? state.fromCustom : state.fromCity;
  const to   = state.direction === "other" ? state.toCustom   : state.toCity;
  const d = state.date ? `${state.date.getDate()} ${t('mon')[state.date.getMonth()]} ${state.date.getFullYear()}` : "";
  const lines = [
    "Omad Tour",
    `${t('from')}: ${from}`,
    `${t('to')}: ${to}`,
    `${t('date')}: ${d}`,
    `${t('tripTypeLabel')}: ${state.tripType === "roundtrip" ? t('roundTripText') : t('oneWayText')}`
  ];
  if(state.tripType === "roundtrip" && state.returnDate){
    lines.push(`${t('returnDate')}: ${state.returnDate.getDate()} ${t('mon')[state.returnDate.getMonth()]} ${state.returnDate.getFullYear()}`);
  }
  const p = state.passengers;
  const paxParts = [`${t('adultsLabel')}: ${p.adults}`];
  // Bu yerda ataylab tarjima qilinmagan "Child"/"Inf" ishlatiladi — ekranda
  // mijozga "Bolalar"/"Chaqaloqlar" ko'rinadi, lekin sizga (agentga)
  // Telegram/WhatsApp orqali keladigan xabarda qisqa, qulay shaklda keladi.
  if(p.children > 0) paxParts.push(`Child: ${p.children}`);
  if(p.infants > 0) paxParts.push(`Inf: ${p.infants}`);
  lines.push(`${t('passengersSummary')}: ${paxParts.join(", ")}`);
  return lines.join("\n");
}

/* Telegram uslubidagi telefon kiritish — davlat bayrog'i va kodi (masalan
   🇷🇺 +7) tugma orqali tanlanadi, mijoz esa faqat qolgan raqamlarni
   kiritadi. UZ/RU/TM davlatlari qo'llab-quvvatlanadi. Har bir davlat uchun
   ANIQ raqam uzunligi belgilangan — na ortiqcha, na kam raqam kiritilmaydi:
   Rossiya (+7) — 10 ta, O'zbekiston (+998) — 9 ta, Turkmaniston (+993) — 8 ta. */
const PHONE_COUNTRIES = [
  { code:"+998", flag:"🇺🇿", name:"O'zbekiston", digits:9 },
  { code:"+7",   flag:"🇷🇺", name:"Rossiya", digits:10 },
  { code:"+993", flag:"🇹🇲", name:"Türkmenistan", digits:8 }
];
function phoneInput(prefix){
  return `<div class="phone-input-wrap">
    <div class="phone-country-list" id="${prefix}CountryList" style="display:none">
      ${PHONE_COUNTRIES.map(c => `<button type="button" class="phone-country-opt" data-code="${c.code}" data-flag="${c.flag}" data-digits="${c.digits}">
        <span class="phone-flag">${c.flag}</span> ${esc(c.name)} <span class="phone-country-code">${c.code}</span>
      </button>`).join("")}
    </div>
    <div class="phone-input-row">
      <button type="button" class="phone-country-btn" id="${prefix}CountryBtn" data-digits="10">
        <span class="phone-flag" id="${prefix}Flag">🇷🇺</span>
        <span class="phone-code" id="${prefix}Code">+7</span>
        <span class="phone-caret">▾</span>
      </button>
      <input type="tel" inputmode="numeric" id="${prefix}PhoneNum" class="phone-number-input" placeholder="900 123 45 67">
    </div>
  </div>`;
}
function wirePhoneInput(prefix){
  const btn = document.getElementById(prefix + "CountryBtn");
  const list = document.getElementById(prefix + "CountryList");
  const flag = document.getElementById(prefix + "Flag");
  const code = document.getElementById(prefix + "Code");
  const num = document.getElementById(prefix + "PhoneNum");
  if(!btn || !list || !num) return;

  function maxDigits(){ return parseInt(btn.dataset.digits, 10) || 15; }
  function clampNum(){
    const digits = num.value.replace(/\D/g,"").slice(0, maxDigits());
    num.value = digits;
  }

  btn.addEventListener("click", (e)=>{
    e.stopPropagation();
    list.style.display = (list.style.display === "none" || !list.style.display) ? "flex" : "none";
  });
  list.querySelectorAll(".phone-country-opt").forEach(opt=>{
    opt.addEventListener("click", ()=>{
      flag.textContent = opt.dataset.flag;
      code.textContent = opt.dataset.code;
      btn.dataset.digits = opt.dataset.digits;
      list.style.display = "none";
      clampNum();
      num.focus();
    });
  });
  document.addEventListener("click", (e)=>{
    if(!list.contains(e.target) && e.target !== btn && !btn.contains(e.target)) list.style.display = "none";
  });
  num.addEventListener("input", clampNum);
}
function getPhoneValue(prefix){
  const code = document.getElementById(prefix + "Code")?.textContent || "";
  const digits = (document.getElementById(prefix + "PhoneNum")?.value || "").replace(/\D/g,"");
  return { full: code + digits, digits, code };
}
function isPhoneValid(prefix){
  const btn = document.getElementById(prefix + "CountryBtn");
  const expected = parseInt(btn?.dataset.digits, 10) || 0;
  const { digits } = getPhoneValue(prefix);
  return digits.length === expected;
}

/* ================== XARITA (Leaflet — 2-ofis uchun oldindan ko'rish,
   hech qanday kalit talab qilmaydi) ================== */
const officeMaps = {};

function ensureLeafletDefaultIcon(){
  if(typeof L === "undefined" || ensureLeafletDefaultIcon._done) return;
  ensureLeafletDefaultIcon._done = true;
  delete L.Icon.Default.prototype._getIconUrl;
  L.Icon.Default.mergeOptions({
    iconRetinaUrl: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon-2x.png",
    iconUrl: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-icon.png",
    shadowUrl: "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/images/marker-shadow.png"
  });
}
function initOfficeMap(id, coords){
  if(typeof L === "undefined") return null;
  ensureLeafletDefaultIcon();
  const el = document.getElementById("map-" + id);
  if(!el || el._leaflet_id) return officeMaps[id] || null;
  const map = L.map(el, { attributionControl:false, zoomControl:false, dragging:false, scrollWheelZoom:false, tap:false })
    .setView([coords.lat, coords.lng], 15);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom:19, attribution:"&copy; OpenStreetMap"
  }).addTo(map);
  L.control.attribution({ prefix:false }).addAttribution("© OpenStreetMap").addTo(map);
  L.marker([coords.lat, coords.lng]).addTo(map);
  officeMaps[id] = map;
  return map;
}

/* Avtomatik slayd-shou — rasmlar o'ngdan chapga siljib, bir-birini
   almashtirib turadi (ofis binosi va kirish joyi fotolari). */
function initSlideshow(id, intervalMs){
  const el = document.getElementById("slideshow-" + id);
  if(!el) return;
  const slides = Array.from(el.querySelectorAll(".office-slide"));
  const dots = Array.from(el.querySelectorAll(".office-slide-dot"));
  if(slides.length < 2){ if(dots[0]) dots[0].classList.add("active"); return; }
  let idx = 0;

  function place(el2, x, animate){
    el2.style.transition = animate ? "transform .6s ease" : "none";
    el2.style.transform = `translateX(${x}%)`;
  }
  slides.forEach((s,i)=> place(s, i === 0 ? 0 : 100, false));
  if(dots[0]) dots[0].classList.add("active");

  setInterval(()=>{
    const cur = slides[idx];
    const nextIdx = (idx + 1) % slides.length;
    const next = slides[nextIdx];
    place(next, 100, false);
    void next.offsetWidth; // reflow — animatsiyasiz joylashtirib, keyin animatsiya bilan siljitish uchun
    place(cur, -100, true);
    place(next, 0, true);
    if(dots[idx]) dots[idx].classList.remove("active");
    if(dots[nextIdx]) dots[nextIdx].classList.add("active");
    setTimeout(()=>{ place(cur, 100, false); }, 650);
    idx = nextIdx;
  }, intervalMs || 3200);
}

let logoTaps = 0, logoTimer = null;

function bind(name, opts){
  document.querySelectorAll(".glass-btn").forEach(btn=>{
    btn.addEventListener("click", e=>{
      const r = btn.getBoundingClientRect();
      const size = Math.max(r.width, r.height);
      const el = document.createElement("span");
      el.className = "ripple";
      el.style.width = el.style.height = size + "px";
      el.style.left = (e.clientX - r.left - size/2) + "px";
      el.style.top  = (e.clientY - r.top  - size/2) + "px";
      btn.appendChild(el);
      setTimeout(()=> el.remove(), 600);
    });
  });
  document.getElementById("backBtn")?.addEventListener("click", back);
  document.querySelectorAll(".lang-btn").forEach(b => b.addEventListener("click", ()=> setLang(b.dataset.lang)));
  document.querySelectorAll("[data-go]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const target = b.dataset.go;
      if(target === "cityStep") go("cityStep", { direction:b.dataset.direction, step:parseInt(b.dataset.step,10) });
      else if(target === "otherCountry"){ state.direction = "other"; go("otherCountry", { step:0 }); }
      else go(target, {});
    });
  });

  if(name === "home") bindHome();
  if(name === "cityStep") bindCityStep(opts);
  if(name === "otherCountry") bindOther(opts);
  if(name === "calendar") bindCalendar(opts);
  if(name === "passengers") bindPassengers();
  if(name === "contact") bindContact();
  if(name === "viza") bindViza();
  if(name === "vizaForm") bindVizaForm();
  if(name === "notarial"){
    document.querySelectorAll("[data-notary-cat]").forEach(b=>{
      b.addEventListener("click", ()=> go("notaryOrder", { cat: b.dataset.notaryCat }));
    });
  }
  if(name === "notaryOrder") bindNotaryOrder();
  if(name === "notaryContact") bindNotaryContact(opts);
  if(name === "myVisaStatus") bindMyStatus();
  if(name === "addresses") bindAddresses();
  if(name === "help") bindHelp();
  if(name === "news") bindNews();
  if(name === "admin") bindAdmin();
}

/* Fayl tanlash + fon rejimida yuklash. `onFileSelected` — ixtiyoriy,
   fayl tanlangan zahoti qo'shimcha ish qilish uchun (masalan OCR). */
function wireDropzone(prefix, onFileSelected){
  const input = document.getElementById(prefix + "File");
  const box = document.getElementById(prefix + "Box");
  const empty = document.getElementById(prefix + "Empty");
  const preview = document.getElementById(prefix + "Preview");
  const thumb = document.getElementById(prefix + "Thumb");
  const nameEl = document.getElementById(prefix + "Name");
  const meta = document.getElementById(prefix + "Meta");
  const detail = document.getElementById(prefix + "Detail");
  const bar = document.getElementById(prefix + "Bar");
  const remove = document.getElementById(prefix + "Remove");
  const err = document.getElementById(prefix + "FileErr");

  const uploader = createUploader((status, errorMsg)=>{
    box.classList.remove("ready","failed");
    meta.classList.remove("ok","err");
    detail.style.display = "none";
    if(status === "working"){ meta.textContent = t('photoUploading'); bar.style.width = "65%"; }
    else if(status === "done"){ meta.textContent = t('photoReady'); meta.classList.add("ok"); bar.style.width = "100%"; box.classList.add("ready"); }
    else if(status === "failed"){
      meta.textContent = t('photoFailed');
      meta.classList.add("err");
      bar.style.width = "0";
      box.classList.add("failed");
      // Xatolikning aniq sababini ko'rsatamiz — "ishlamadi" deyish o'rniga
      // NEGA ishlamaganini ko'rish orqali muammoni tezda topib bo'ladi.
      if(errorMsg){
        detail.textContent = errorMsg;
        detail.style.display = "block";
      }
    }
    else { bar.style.width = "0"; }
  });

  function show(file){
    const r = new FileReader();
    r.onload = e => { thumb.src = e.target.result; };
    r.readAsDataURL(file);
    nameEl.textContent = file.name;
    meta.textContent = t('photoPreparing');
    empty.style.display = "none";
    preview.style.display = "flex";
    if(err) err.style.display = "none";
  }

  box.addEventListener("click", e=>{
    if(e.target === remove) return;
    if(uploader.status === "failed"){ uploader.retry(); return; }
    input.click();
  });
  input.addEventListener("change", ()=>{
    const f = input.files[0];
    if(!f) return;
    show(f);
    uploader.setFile(f);
    if(typeof onFileSelected === "function") onFileSelected(f);
  });
  remove.addEventListener("click", e=>{
    e.stopPropagation();
    input.value = "";
    empty.style.display = "flex";
    preview.style.display = "none";
    thumb.removeAttribute("src");
    box.classList.remove("ready","failed");
    uploader.clear();
  });
  return uploader;
}

/* ================== OCR — blankadagi ariza raqami (barkod) va pasport
   raqamini mijozning telefonida, bepul o'qib olish (Tesseract.js).
   Bu hech qanday serverga yoki davlat saytiga ulanmaydi — faqat mijoz
   o'zi yuborgan rasmni "o'qiydi", shu bilan admin raqamlarni suratdan
   qo'lda o'qib yozishga vaqt sarflamaydi.

   TEZLIK UCHUN: 2 ta alohida "ishchi" (worker) PARALEL ishlaydi — biri
   kontrastli, biri ko'k siyoh (masalan qo'lda chizilgan doira) ta'sirini
   kamaytiruvchi versiyani bir vaqtning o'zida o'qiydi. Bu ikkalasi ham
   faqat inglizcha (tez), chunki blankadagi raqam/harflar lotin yozuvida.
   Faqat ikkalasi ham hech narsa topolmasa — uchinchi, sekinroq lekin
   kuchliroq (ingliz+rus) urinish ishga tushadi. ================== */
let ocrWorkerA = null, ocrWorkerB = null, ocrWorkerFull = null;
function getOcrWorkerA(){
  if(!ocrWorkerA){
    if(typeof Tesseract === "undefined") return Promise.reject(new Error("no tesseract"));
    ocrWorkerA = Tesseract.createWorker("eng");
  }
  return ocrWorkerA;
}
function getOcrWorkerB(){
  if(!ocrWorkerB){
    if(typeof Tesseract === "undefined") return Promise.reject(new Error("no tesseract"));
    ocrWorkerB = Tesseract.createWorker("eng");
  }
  return ocrWorkerB;
}
function getOcrWorkerFull(){
  if(!ocrWorkerFull){
    if(typeof Tesseract === "undefined") return Promise.reject(new Error("no tesseract"));
    // Rus tili faqat oxirgi, kamdan-kam ishlatiladigan chora sifatida —
    // shu bilan oddiy holatlarda tezlikni pasaytirmaydi.
    ocrWorkerFull = Tesseract.createWorker(["eng","rus"]);
  }
  return ocrWorkerFull;
}

/* Formatni "taxmin qilish" o'rniga — anketadagi yozuvning (label) o'zini
   qidiradi ("...ПАСПОРТ...", "...ЗАЯВКИ.../БАРКОД...") va aynan o'sha
   yozuv atrofidan qiymatni oladi. Shu tufayli pasport RAQAMI qanday
   ko'rinishda bo'lishidan qat'i nazar (faqat raqam, harf+raqam, turli
   davlat pasporti va h.k.) — baribir topa oladi. */
// To'lov kvitansiyasi (chek) ko'pincha anketaning USTIGA yopishtirilgan
// bo'ladi — va uning ichidagi kodlar (RRN, avtorizatsiya kodi, chek raqami
// va h.k.) bizning qidiruvimizni CHALG'ITIB, haqiqiy pasport/barkod o'rniga
// chekning raqamini olib qo'yishi mumkin edi. Shu qatorlarni "xavfli zona"
// deb belgilab, butunlay chetlab o'tamiz.
const RECEIPT_MARKERS = [
  "СУММА","КОМИССИЯ","RRN","АВТОРИЗАЦ","ОПЛАЧЕНО","ОПЛАТА","ПРИНЯТ","ЧК ",
  "KAPTA","КАРТА","MIR","VISA","AID","TVR","TSI","ID0000","КОД (ХОСТ)",
  "ДАТА (ХОСТ)","ДАТА (ПРИНЯТ","ПОДПИСЬ КАССИРА","ОДОБРЕНО","RUB"
];
function findReceiptZoneLines(lines){
  const zone = new Set();
  lines.forEach((line, i)=>{
    if(RECEIPT_MARKERS.some(marker => line.includes(marker))){
      // O'sha qatorning o'zi va atrofidagi 1 qatorni ham xavfli deb belgilaymiz
      // (chek matni odatda bir necha qatorga cho'zilgan bo'ladi).
      zone.add(i-1); zone.add(i); zone.add(i+1);
    }
  });
  return zone;
}
function findValueNearLabel(lines, labelPatterns, valuePattern, excludeValue, skipSet){
  for(let i = 0; i < lines.length; i++){
    if(skipSet && skipSet.has(i)) continue;
    const line = lines[i];
    if(!labelPatterns.some(p => line.includes(p))) continue;
    // Avval — xuddi shu qatorning o'zidan, so'ng keyingi bir necha qatordan
    // qidiramiz (jadval ko'rinishidagi anketalarda qiymat yorliqdan
    // bir necha qator pastda joylashgan bo'lishi mumkin).
    const candidates = [line];
    for(let j = i+1; j <= Math.min(i+20, lines.length-1); j++){
      if(!skipSet || !skipSet.has(j)) candidates.push(lines[j]);
    }
    for(const cand of candidates){
      const matches = cand.match(valuePattern) || [];
      for(const m of matches){
        const clean = m.replace(/[\s-]/g,"");
        if(excludeValue && clean === excludeValue) continue; // ikkala maydon bir xil bo'lib qolmasin
        if(clean.length >= 6) return clean;
      }
    }
  }
  return "";
}
function extractVisaFields(rawText){
  const upper = (rawText || "").toUpperCase();
  // OCR ba'zan raqamlarni bir-biridan bo'shliq bilan ajratib o'qiydi
  // (masalan "5 3 8 5 0..." — xira suratlarda tez-tez uchraydi). Bunday
  // qatorlarni avval "yig'ib" qo'yamiz, shunda oddiy qidiruv ham ularni topadi.
  // MUHIM: bo'shliq/chiziqchani yig'ganda QATOR KO'CHISH (\n) ni ushlab
  // qolmaslik kerak — aks holda qatorlar bir-biriga "yopishib" qolib,
  // barkodni yo'qotib qo'yadi.
  const collapsed = upper.replace(/\b(?:[A-Z0-9][ \t-]+){3,}[A-Z0-9]\b/g, m => m.replace(/[ \t-]+/g,""));
  const lines = collapsed.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const receiptZone = findReceiptZoneLines(lines);
  // To'lov cheki (agar bo'lsa) chetlab o'tilgan "toza" matn.
  const safeLines = lines.filter((_, i) => !receiptZone.has(i));
  const safeText = safeLines.join("\n");

  // Ariza raqami (barkod) — "ЗАЯВКИ" / "БАРКОД" / "BARCODE" yozuvi
  // atrofidan uzun raqam ketma-ketligini qidiramiz. `Tier` — topilgan
  // natijaning ISHONCHLILIK DARAJASI (0=eng ishonchli, aniq yorliq yonidan
  // topilgan; 1=zaxira usuli). Bir nechta OCR urinishini birlashtirganda,
  // ENG ISHONCHLI (eng kichik tier) natija g'olib chiqadi.
  let barcode = findValueNearLabel(lines, ["ЗАЯВКИ","БАРКОД","BARCODE","ARIZA"], /\d{10,16}/g, null, receiptZone);
  let barcodeTier = barcode ? 0 : 99;
  if(!barcode){
    // Zaxira: chekka tegishli bo'lmagan qatorlardan eng UZUN raqam
    // ketma-ketligini olamiz. Anketa barkodi deyarli har doim varaqning
    // ENG PASTIDA (oxirida) bo'ladi, chek esa yuqorida — shuning uchun
    // OXIRGI (eng pastdagi) mosligni tanlaymiz, birinchisini emas.
    const matches = safeText.match(/\b\d{10,16}\b/g) || [];
    if(matches.length){ barcode = matches[matches.length - 1]; barcodeTier = 1; }
  }

  return { barcode, barcodeTier };
}
/* Bir nechta OCR urinishidan (masalan turli "tozalash" usullaridan) kelgan
   natijalarni birlashtiradi — shunchaki "birinchi topilgan g'olib" emas,
   balki ENG ISHONCHLI (eng kichik tier raqamiga ega) natija g'olib chiqadi. */
function mergeVisaFields(a, b){
  function pick(valA, tierA, valB, tierB){
    if(!valA) return valB || "";
    if(!valB) return valA || "";
    return (tierA <= tierB) ? valA : valB;
  }
  return {
    barcode: pick(a && a.barcode, (a && a.barcodeTier) ?? 99, b && b.barcode, (b && b.barcodeTier) ?? 99)
  };
}
/* ---- Rasmni OCR'dan OLDIN "tozalash" — rang muammosini (pushti, sariq,
   har qanday yorug'lik nurlanishi) BUTUNLAY yo'q qiladi (kulrang qilib),
   va kontrastni oshirib, xira/kuchsiz matnni ham aniqroq qiladi. Bir nechta
   usul ketma-ket sinaladi — biri yetarli bo'lmasa, kuchliroq usulga o'tadi. ---- */
function makeOcrVariant(img, mode){
  let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const maxDim = 1800;
  if(Math.max(w,h) > maxDim){
    const scale = maxDim / Math.max(w,h);
    w = Math.round(w*scale); h = Math.round(h*scale);
  }
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext("2d");
  ctx.drawImage(img, 0, 0, w, h);
  if(mode === "raw") return canvas;

  const imgData = ctx.getImageData(0, 0, w, h);
  const d = imgData.data;
  const n = w * h;

  if(mode === "redchannel"){
    // Ko'k siyoh (mijozlar ko'pincha ko'k ruchka bilan pasport/barkod
    // raqamini DOIRAGA olib belgilaydi) — QIZIL kanalning o'zida deyarli
    // ko'rinmay qoladi, chunki ko'k siyoh qizil nurni qaytaradi. Qora
    // bosma matn esa barcha kanallarda bab-baravar qorong'i bo'lgani
    // uchun aniq qolaveradi. Shu tufayli doira chizig'i matnni
    // "kesib" yubormaydi.
    const red = new Float32Array(n);
    let min = 255, max = 0;
    for(let i = 0, p = 0; i < d.length; i += 4, p++){
      const v = d[i];
      red[p] = v;
      if(v < min) min = v;
      if(v > max) max = v;
    }
    const range = Math.max(1, max - min);
    for(let i = 0, p = 0; i < d.length; i += 4, p++){
      let v = ((red[p]-min)/range) * 255;
      v = Math.min(255, Math.max(0, (v-128)*1.6 + 128));
      d[i] = d[i+1] = d[i+2] = v;
    }
    ctx.putImageData(imgData, 0, 0);
    return canvas;
  }

  const gray = new Float32Array(n);
  let min = 255, max = 0;
  for(let i = 0, p = 0; i < d.length; i += 4, p++){
    const g = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    gray[p] = g;
    if(g < min) min = g;
    if(g > max) max = g;
  }
  const range = Math.max(1, max - min);

  if(mode === "contrast"){
    // Kulrangga o'tkazish (rang bosishini yo'qotadi) + kontrastni cho'zish —
    // eng ko'p holatlarda yetarli bo'ladigan, birinchi urinish.
    for(let i = 0, p = 0; i < d.length; i += 4, p++){
      let v = ((gray[p]-min)/range) * 255;
      v = Math.min(255, Math.max(0, (v-128)*1.5 + 128));
      d[i] = d[i+1] = d[i+2] = v;
    }
  }else if(mode === "threshold"){
    // Kuchli qora-oq chegaralash — juda past kontrastli yoki kuchli rang
    // bosgan suratlar uchun oxirgi, eng kuchli chora.
    let sum = 0;
    for(let p = 0; p < n; p++) sum += gray[p];
    const mean = sum / n;
    for(let i = 0, p = 0; i < d.length; i += 4, p++){
      const v = gray[p] > mean ? 255 : 0;
      d[i] = d[i+1] = d[i+2] = v;
    }
  }
  ctx.putImageData(imgData, 0, 0);
  return canvas;
}
function canvasToBlob(canvas){
  return new Promise(resolve => canvas.toBlob(resolve, "image/png"));
}

/* ================== Shtrix-kodning O'ZINI dekodlash (ZXing) ==================
   Bu — OCR emas: shtrix-kod (chiziqlar) ichida xato-tuzatish (checksum)
   qurilgan, shuning uchun agar biror chiziq noaniq bo'lsa, dastur buni
   DARHOL biladi va "topilmadi" deydi — hech qachon xato raqamni to'g'ri
   deb ko'rsatmaydi. Shu sabab bu — birinchi va eng ishonchli urinish. */
let zxingReader = null;
function getZxingReader(){
  if(!zxingReader){
    if(typeof ZXingBrowser === "undefined") return null;
    zxingReader = new ZXingBrowser.BrowserMultiFormatReader();
  }
  return zxingReader;
}
async function tryDecodeBarcodeGraphic(file){
  const reader = getZxingReader();
  if(!reader) return "";
  const url = URL.createObjectURL(file);
  try{
    const result = await reader.decodeFromImageUrl(url);
    const text = (result && typeof result.getText === "function") ? result.getText() : "";
    // Shtrix-kod ichida ba'zan bo'sh joy/chiziqcha ham bo'lishi mumkin —
    // bizga faqat raqamlar kerak.
    const digits = (text || "").replace(/\D/g, "");
    return digits.length >= 8 ? digits : "";
  }catch(e){
    return ""; // Shtrix topilmadi — OCR zaxira sifatida ishga tushadi.
  }finally{
    URL.revokeObjectURL(url);
  }
}

async function runVizaOcr(file, prefix){
  const p = prefix || "viza0";
  const statusEl = document.getElementById(p + "OcrStatus");
  const barcodeInput = document.getElementById(p + "Barcode");
  if(!statusEl || !barcodeInput) return;
  statusEl.style.display = "block";
  statusEl.className = "ocr-status working";
  statusEl.textContent = t('ocrWorking');

  // 1-QADAM (eng ishonchli): shtrix-kodning o'zini to'g'ridan-to'g'ri
  // dekodlashga harakat qilamiz. Muvaffaqiyatli bo'lsa — bu YETARLI,
  // sekinroq OCR jarayoniga umuman hojat qolmaydi.
  try{
    const scanned = await tryDecodeBarcodeGraphic(file);
    if(scanned && !barcodeInput.value){
      barcodeInput.value = scanned;
      statusEl.className = "ocr-status ok";
      statusEl.textContent = t('ocrFound');
      return;
    }
  }catch(e){ /* jim o'tamiz, OCR bilan davom etamiz */ }

  // 2-QADAM (zaxira): shtrix-kod dekodlanmadi (masalan surat juda xira
  // yoki shtrix yaxshi ko'rinmagan) — matn o'qish (OCR) orqali qidiramiz.
  if(typeof Tesseract === "undefined"){
    // Tesseract yuklanmagan (masalan tarmoq bloklagan) — jim o'tamiz,
    // mijoz maydonni qo'lda to'ldirishi ham mumkin.
    statusEl.className = "ocr-status empty";
    statusEl.textContent = t('ocrNotFound');
    return;
  }
  try{
    const img = await loadImage(file);

    async function tryMode(workerPromise, mode){
      try{
        const worker = await workerPromise;
        const canvas = makeOcrVariant(img, mode);
        const blob = await canvasToBlob(canvas);
        const { data } = await worker.recognize(blob || file);
        return extractVisaFields(data.text);
      }catch(_){ return { barcode:"" }; }
    }

    // TEZLIK VA ANIQLIK: ikkita usulni BIR VAQTNING O'ZIDA (parallel, 2
    // alohida "ishchi" bilan) sinaymiz — biri kontrastli, biri ko'k siyoh
    // (masalan mijoz qo'lda chizgan doira) ta'sirini kamaytiruvchi versiya
    // — chunki barkod atrofiga ham ko'pincha shunday belgi qo'yiladi.
    // Ikkalasidan ENG ISHONCHLISI tanlanadi. Bu ketma-ket ishlashdan
    // TAXMINAN 2 BARAVAR tezroq.
    const [resA, resB] = await Promise.all([
      tryMode(getOcrWorkerA(), "contrast"),
      tryMode(getOcrWorkerB(), "redchannel")
    ]);
    let combined = mergeVisaFields(resA, resB);

    // Faqat ikkalasi ham hech narsa topa olmagan taqdirdagina — sekinroq,
    // lekin kuchliroq (ingliz+rus, asl rasm) oxirgi urinish.
    if(!combined.barcode){
      const resC = await tryMode(getOcrWorkerFull(), "raw");
      combined = mergeVisaFields(combined, resC);
    }

    let foundAny = false;
    if(combined.barcode && !barcodeInput.value){ barcodeInput.value = combined.barcode; foundAny = true; }
    statusEl.className = "ocr-status " + (foundAny ? "ok" : "empty");
    statusEl.textContent = foundAny ? t('ocrFound') : t('ocrNotFound');
  }catch(e){
    statusEl.className = "ocr-status empty";
    statusEl.textContent = t('ocrNotFound');
  }
}

/* Notarial buyurtma — belgilangan variantlar + qo'lda yozilgan matn +
   telefon (MAJBURIY) birlashtirilib, tayyor xabar hosil qilinadi. */
function bindNotaryOrder(){
  wirePhoneInput("notary");

  const btn = document.getElementById("notarySubmit");
  if(!btn) return;
  const catId = btn.dataset.cat || "passport";
  const cat = NOTARY_CATEGORIES[catId] || NOTARY_CATEGORIES.passport;

  const svcErr = document.getElementById("notaryServiceErr");
  const manualErr = document.getElementById("notaryManualErr");
  const phoneErr = document.getElementById("notaryPhoneErr");
  const manualEl = document.getElementById("notaryManual");

  function selected(){
    return Array.from(document.querySelectorAll(".notary-check:checked"))
      .map(el => el.dataset.label);
  }
  document.querySelectorAll(".notary-check").forEach(el=>{
    el.addEventListener("change", ()=>{
      if(selected().length || (manualEl && manualEl.value.trim())) svcErr.style.display = "none";
    });
  });
  if(manualEl){
    manualEl.addEventListener("input", ()=>{
      if(manualEl.value.trim()){
        svcErr.style.display = "none";
        manualErr.style.display = "none";
      }
    });
  }

  btn.addEventListener("click", ()=>{
    const services = selected();
    const manual = (manualEl?.value || "").trim();
    const phoneOk = isPhoneValid("notary");

    // "Boshqa masala" bo'limida qo'lda yozish MAJBURIY, qolganlarida esa
    // kamida bitta variant belgilangan YOKI qo'lda yozilgan bo'lishi kerak.
    let ok = true;
    if(cat.manualRequired){
      const has = !!manual;
      manualErr.style.display = has ? "none" : "block";
      svcErr.style.display = "none";
      if(!has) ok = false;
    }else{
      const has = services.length > 0 || !!manual;
      svcErr.style.display = has ? "none" : "block";
      manualErr.style.display = "none";
      if(!has) ok = false;
    }
    phoneErr.style.display = phoneOk ? "none" : "block";
    if(!phoneOk) ok = false;
    if(!ok) return;

    const phoneVal = getPhoneValue("notary").full;
    const lines = ["📋 " + t(cat.titleKey), ""];
    if(services.length){
      lines.push(t('notaryChoose') + ":");
      services.forEach((s, i)=> lines.push(`${i + 1}. ${s}`));
      lines.push("");
    }
    if(manual){
      lines.push("💬 " + manual, "");
    }
    lines.push(`📞 ${t('yourPhoneLabel')}: ${phoneVal}`);

    go("notaryContact", { text: lines.join("\n"), phone: phoneVal });
  });
}

function bindVizaForm(){
  wirePhoneInput("viza");

  const listBox = document.getElementById("anketaList");
  const btn = document.getElementById("vizaSubmit");
  const status = document.getElementById("vizaStatus");
  const addBtn = document.getElementById("addAnketaBtn");
  let busy = false;

  // Har bir anketa uchun: { idx, prefix, uploader }
  const anketas = [];
  let nextIdx = 0;

  function renumber(){
    // Blok o'chirilganda raqamlar ketma-ket qolishi uchun qayta raqamlaymiz
    // (masalan 2-anketa o'chsa, 3-si "Anketa 2" bo'lib qoladi).
    Array.from(listBox.querySelectorAll(".anketa-block")).forEach((el, i)=>{
      const numEl = el.querySelector(".anketa-num");
      if(numEl) numEl.textContent = t('anketaLabel') + " " + (i + 1);
    });
    // Faqat bitta anketa qolsa — o'chirish tugmasini yashiramiz.
    const dels = listBox.querySelectorAll(".anketa-del");
    dels.forEach(d => { d.style.display = anketas.length > 1 ? "flex" : "none"; });
  }

  function addAnketa(){
    const idx = nextIdx++;
    const prefix = "viza" + idx;
    listBox.insertAdjacentHTML("beforeend", anketaBlock(idx));
    // OCR rasm yuklashdan keyin, uni bo'g'ib qo'ymasligi uchun kechiktiriladi.
    const uploader = wireDropzone(prefix, (file)=> setTimeout(()=> runVizaOcr(file, prefix), 700));
    anketas.push({ idx, prefix, uploader });

    const delBtn = document.querySelector(`[data-del="${idx}"]`);
    if(delBtn){
      delBtn.addEventListener("click", ()=>{
        const pos = anketas.findIndex(a => a.idx === idx);
        if(pos !== -1) anketas.splice(pos, 1);
        const block = document.getElementById("anketaBlock" + idx);
        if(block) block.remove();
        renumber();
      });
    }
    renumber();
  }

  addAnketa(); // birinchi anketa har doim bo'ladi
  addBtn.addEventListener("click", addAnketa);

  /* Bitta anketani yuborish — bazaga saqlash, bildirishnomaga obuna va
     Telegramga xabar. Har bir anketa MUSTAQIL yozuv bo'ladi, shuning uchun
     admin ularni alohida-alohida ("✅ Tayyor" / "⏳") belgilay oladi. */
  async function submitOne(a, phoneVal, id, groupIndex, groupTotal){
    const barcodeVal = (document.getElementById(a.prefix + "Barcode")?.value || "").trim();
    // Bir necha anketa birga yuborilsa, Telegramda har biri "Oilaviy
    // blanka N / M" deb belgilanadi — admin adashtirmasligi uchun.
    const meta = { barcode: barcodeVal, groupIndex, groupTotal };
    // Rasm fayl tanlangan zahoti fonda yuklana boshlagan — yaxshi internetda
    // bu paytga kelib allaqachon tayyor bo'ladi (kutish bo'lmaydi).
    const uploadedNow = (a.uploader.status === "done") ? await a.uploader.resolve() : null;

    const visaResult = await addVisa(phoneVal, uploadedNow || "", id, { barcode: barcodeVal });
    if(!visaResult.saved) throw new Error(visaResult.detail || "save failed");
    addMyVisaId(id);
    subscribeForVisaUpdates(id).catch(()=>{});

    if(uploadedNow){
      notifyTelegramVisa(a.uploader.base64, phoneVal, id, meta)
        .then(ok => { if(!ok) console.warn("Telegram notify not confirmed for visa #" + id); });
    }else{
      // Sekin internet — mijozni kuttirmaymiz: adminga darhol matnli xabar
      // (telefon + barkod + tugmalar), rasm esa fonda tayyor bo'lgach keladi.
      notifyTelegramVisaPending(phoneVal, id, meta)
        .then(ok => { if(!ok) console.warn("Pending notify not confirmed for visa #" + id); });
      a.uploader.resolve().then(async (url)=>{
        try{
          await updateVisaImage(id, url);
          await notifyTelegramVisaPhoto(a.uploader.base64, phoneVal, id, meta);
        }catch(err){ console.warn("Background photo delivery failed for visa #" + id, err); }
      }).catch(err => console.warn("Background upload failed for visa #" + id, err));
    }
  }

  btn.addEventListener("click", async ()=>{
    if(busy) return;

    const phoneOk = isPhoneValid("viza");
    document.getElementById("vizaPhoneErr").style.display = phoneOk ? "none" : "block";

    // Har bir anketada rasm borligini tekshiramiz — qaysi biri bo'sh
    // bo'lsa, aynan o'sha blokda xato ko'rsatiladi.
    let allHaveFile = true;
    anketas.forEach(a=>{
      const has = !!a.uploader.file;
      const errEl = document.getElementById(a.prefix + "FileErr");
      if(errEl) errEl.style.display = has ? "none" : "block";
      if(!has) allHaveFile = false;
    });
    if(!phoneOk || !allHaveFile || !anketas.length) return;

    busy = true;
    btn.disabled = true;
    btn.textContent = t('sending');
    status.className = "footer-note";
    status.textContent = "";

    const phoneVal = getPhoneValue("viza").full;
    const baseId = Date.now();

    try{
      // Barcha anketalarni ketma-ket yuboramiz. ID'lar bir-biridan farq
      // qilishi uchun har biriga alohida raqam beriladi.
      for(let i = 0; i < anketas.length; i++){
        if(anketas.length > 1){
          status.textContent = `${i + 1} / ${anketas.length}…`;
        }
        await submitOne(anketas[i], phoneVal, baseId + i, i + 1, anketas.length);
      }
      status.className = "footer-note ok";
      status.textContent = t('submitSuccess');
      setTimeout(home, 1200);
    }catch(e){
      status.className = "footer-note err";
      status.textContent = t('submitFail');
      btn.disabled = false;
      btn.textContent = t('send');
      busy = false;
    }
  });
}

/* Jarayon bosqichlari — mijoz o'z so'rovi qaysi bosqichda ekanini
   BIR QARASHDA ko'radi. Bu "qachon bo'ladi?" degan qo'ng'iroqlarni
   sezilarli kamaytiradi, chunki javob ekranning o'zida turadi. */
function statusSteps(currentStatus){
  const steps = [
    { key:"sent",     label: t('stepSent') },
    { key:"review",   label: t('stepReview') },
    { key:"done",     label: t('stepDone') }
  ];
  // "new" va "pending" — ikkalasi ham 2-bosqich (ko'rib chiqilmoqda).
  const activeIdx = currentStatus === "ready" ? 2 : 1;
  // Viza TAYYOR bo'lgan holatda — oxirgi bosqich ham BAJARILGAN hisoblanadi
  // (yashil ✓ bilan), chunki jarayon yakunlangan. Aks holda "Natija tayyor"
  // deb yozilib turgan bo'lsa-yu, yonida qizil "3" raqami qolsa, mijoz
  // "hali tugamaganmi?" deb chalkashadi.
  const isFinished = currentStatus === "ready";
  return `<div class="steps-row">
    ${steps.map((s,i)=>{
      const isDone = i < activeIdx || (isFinished && i === activeIdx);
      const cls = isDone ? "done" : (i === activeIdx ? "active" : "");
      const mark = isDone ? "✓" : (i + 1);
      const lineDone = i < activeIdx;
      return `<div class="step ${cls}">
        <span class="step-dot">${mark}</span>
        <span class="step-label">${esc(s.label)}</span>
      </div>${i < steps.length - 1 ? `<span class="step-line ${lineDone ? 'done' : ''}"></span>` : ""}`;
    }).join("")}
  </div>`;
}

function bindNews(){
  // Bildirishnoma taklifi — agar mijoz hali obuna bo'lmagan bo'lsa,
  // tepada chiroyli tugma ko'rinadi. Bosilganda ruxsat so'raladi va
  // shundan keyin yangi e'lonlar telefon ekranida SMS kabi chiqadi.
  const cta = document.getElementById("pushCta");
  if(cta){
    const supported = ("serviceWorker" in navigator) && ("PushManager" in window) && (typeof Notification !== "undefined");
    if(supported){
      isPushSubscribed().then(on=>{
        cta.style.display = "flex";
        if(on){
          cta.classList.add("on");
          document.getElementById("pushCtaTitle").textContent = t('pushOnTitle');
          document.getElementById("pushCtaSub").textContent = t('pushOnSub');
          return;
        }
        let working = false;
        cta.addEventListener("click", async ()=>{
          if(working || cta.classList.contains("on")) return;
          working = true;
          const subEl = document.getElementById("pushCtaSub");
          subEl.textContent = t('pushWorking');
          const r = await subscribeToPush(null);
          working = false;
          if(r && r.ok){
            cta.classList.add("on");
            document.getElementById("pushCtaTitle").textContent = t('pushOnTitle');
            subEl.textContent = t('pushOnSub');
          }else{
            // Aniq sababni ko'rsatamiz — mijoz nima qilish kerakligini biladi,
            // "…" holatida qotib qolmaydi.
            const reason = (r && r.reason) || "unknown";
            const map = {
              denied: 'pushDenied',
              dismissed: 'pushDismissed',
              swNotReady: 'pushNeedInstall',
              noPush: 'pushNeedInstall',
              noNotif: 'pushNeedInstall',
              noSW: 'pushNeedInstall',
              noPushManager: 'pushNeedInstall',
              subscribeFailed: 'pushNeedInstall',
              serverError: 'pushServerError'
            };
            subEl.textContent = t(map[reason] || 'pushFailed');
            // TASHXIS: aynan nima ishlamayotganini ko'rsatamiz. Bu qator
            // faqat muammo bo'lganda chiqadi va sababni aniqlashga yordam
            // beradi (masalan iOS'da ilova o'rnatilganmi yoki yo'qmi).
            const diagEl = document.getElementById("pushCtaDiag");
            if(diagEl){
              const standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
              const parts = [
                "sabab=" + reason,
                "ilova=" + (standalone ? "HA" : "YO'Q"),
                "ruxsat=" + (typeof Notification !== "undefined" ? Notification.permission : "yo'q"),
                "SW=" + (("serviceWorker" in navigator) ? "bor" : "yo'q"),
                "Push=" + (("PushManager" in window) ? "bor" : "yo'q")
              ];
              diagEl.textContent = parts.join(" · ");
              diagEl.style.display = "block";
            }
          }
        });
      });
    }
  }

  fetchNews().then(list=>{
    setNewsSeen(list.length);
    store.set("omad_news_count", String(list.length));
    const box = document.getElementById("newsBox");
    if(!box) return;
    if(!list.length){ box.innerHTML = `<div class="footer-note">${esc(t('noNews'))}</div>`; return; }
    box.innerHTML = list.map((n,i)=>`<div class="news-item" data-idx="${i}">
      ${n.imageUrl ? `<img class="news-thumb" src="${esc(n.imageUrl)}" alt="">` : `<span class="news-thumb news-thumb-ph">${ICONS.megaphone}</span>`}
      <div class="news-row-text"><span class="news-date">${esc(n.date)}</span>${esc(n.text)}</div>
    </div>`).join("");
    box.querySelectorAll("[data-idx]").forEach(el=>{
      el.addEventListener("click", ()=> showStory(list[parseInt(el.dataset.idx,10)]));
    });
  });
}

function showStory(item){

    ${item.imageUrl ? `<img class="story-img" src="${esc(item.imageUrl)}" alt="">` : `<div class="story-noimg">${ICONS.megaphone}</div>`}
