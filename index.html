/* Rasmni to'liq ekranda kattalashtirib ko'rish — anketadagi mayda
   yozuvlarni (barkod, pasport raqami) aniq o'qish uchun. Barmoq bilan
   torttirib yanada kattalashtirish ham mumkin. */
function openImageZoom(src){
  const ov = document.createElement("div");
  ov.className = "img-zoom-overlay";
  ov.innerHTML = `
    <button type="button" class="img-zoom-close" aria-label="close">✕</button>
    <div class="img-zoom-scroll"><img src="${esc(src)}" alt=""></div>`;
  document.body.appendChild(ov);
  const close = ()=> ov.remove();
  ov.querySelector(".img-zoom-close").addEventListener("click", close);
  ov.addEventListener("click", (e)=>{ if(e.target === ov) close(); });
}

function bindAdmin(){
  const up = wireDropzone("news");

  /* ===== VIZA SO'ROVLARI RO'YXATI =====
     Barcha so'rovlar bitta joyda: filtr (hammasi / kutilmoqda / tayyor),
     telefon yoki barkod bo'yicha qidiruv, va rasmga bosib kattalashtirib
     ko'rish. Telegram'da qidirib o'tirishga hojat qolmaydi. */
  let visaCache = [];
  let visaFilter = "all";

  function renderVisaList(){
    const box = document.getElementById("adminVisaList");
    if(!box) return;
    const q = (document.getElementById("adminVisaSearch")?.value || "").trim().toLowerCase();
    let items = visaCache.slice();
    if(visaFilter === "ready") items = items.filter(v => v.status === "ready");
    else if(visaFilter === "waiting") items = items.filter(v => v.status !== "ready");
    if(q){
      items = items.filter(v =>
        String(v.phone || "").toLowerCase().includes(q) ||
        String(v.barcode || "").toLowerCase().includes(q)
      );
    }
    if(!items.length){ box.innerHTML = `<div class="footer-note">Topilmadi.</div>`; return; }
    box.innerHTML = items.map(v=>{
      const badge = v.status === "ready"
        ? `<span class="admin-visa-badge ready">✅ Tayyor</span>`
        : `<span class="admin-visa-badge waiting">⏳ Kutilmoqda</span>`;
      const thumb = v.imageUrl
        ? `<img class="admin-visa-thumb" src="${esc(v.imageUrl)}" data-zoom="${esc(v.imageUrl)}" alt="">`
        : `<span class="admin-visa-thumb admin-visa-noimg">—</span>`;
      return `<div class="admin-visa-row">
        ${thumb}
        <div class="admin-visa-info">
          ${badge}
          <div class="admin-visa-phone">${esc(v.phone || "—")}</div>
          ${v.barcode ? `<div class="admin-visa-code">${esc(v.barcode)}</div>` : ""}
          <div class="admin-visa-date">${esc(v.date || "")}</div>
        </div>
      </div>`;
    }).join("");
    box.querySelectorAll("[data-zoom]").forEach(img=>{
      img.addEventListener("click", ()=> openImageZoom(img.dataset.zoom));
    });
  }

  function loadVisaList(){
    fetchVisa().then(list=>{
      visaCache = Array.isArray(list) ? list : [];
      renderVisaList();
    }).catch(()=>{
      const box = document.getElementById("adminVisaList");
      if(box) box.innerHTML = `<div class="footer-note err">Yuklab bo'lmadi.</div>`;
    });
  }

  document.querySelectorAll(".admin-filter").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      visaFilter = btn.dataset.filter;
      document.querySelectorAll(".admin-filter").forEach(b => b.classList.toggle("selected", b === btn));
      renderVisaList();
    });

  document.getElementById("adminVisaSearch")?.addEventListener("input", renderVisaList);

  function renderList(){

          b.textContent = "…";
          await deleteNews(parseInt(b.dataset.id,10));
          renderList();
        });
      });
    });
  }
  renderList();

  document.getElementById("newsAdd").addEventListener("click", async ()=>{
    const input = document.getElementById("newsInput");
    const status = document.getElementById("newsAddStatus");
    const val = input.value.trim();
    if(!val) return;
    const btn = document.getElementById("newsAdd");
    btn.disabled = true; btn.textContent = "Qo'shilmoqda…";

    try{ if(up.file) imageUrl = await up.resolve(); }
    catch(e){ status.className = "footer-note err"; status.textContent = "Rasm yuklanmadi — matn rasmsiz saqlandi."; }
    const r = await addNews(val, imageUrl);
    if(!r.ok){ status.className = "footer-note err"; status.textContent = "Saqlanmadi: " + r.detail; }
    else{
      // Yangilik saqlandi — endi BARCHA obunachilarga bildirishnoma
      // yuboramiz. Ular telefon ekranida SMS kabi ko'radi, sayt ochiq
      // bo'lmasa ham.
      status.className = "footer-note"; status.textContent = "Bildirishnoma yuborilmoqda…";
      const push = await broadcastNewsPush(val);
      if(push && push.ok){
        status.className = "footer-note ok";
        status.textContent = `Saqlandi ✓ — bildirishnoma ${push.sent} ta qurilmaga yuborildi.`;
      }else{
        status.className = "footer-note";
        status.textContent = "Saqlandi ✓ (bildirishnoma yuborilmadi" +
          (push && push.reason ? ": " + push.reason : "") + ")";
      }
    }
    input.value = "";
    document.getElementById("newsRemove").click();
    btn.disabled = false; btn.textContent = "Yangilik qo'shish";
    renderList();
  });

  document.getElementById("resetVisa").addEventListener("click", async ()=>{
    if(!confirm("Barcha viza so'rovlari o'chiriladi. Davom etasizmi?")) return;
    const btn = document.getElementById("resetVisa");
    const status = document.getElementById("resetStatus");
    btn.disabled = true; btn.textContent = "Tozalanmoqda…";
    const r = await kvSet("visa_submissions", []);
    status.className = "footer-note " + (r.ok ? "ok" : "err");
    status.textContent = r.ok ? "Tozalandi." : "Xatolik: " + r.detail;
    btn.disabled = false; btn.textContent = "Viza so'rovlarini tozalash";
  });
}

/* ================== FON ANIMATSIYASI ================== */
(function(){
  const canvas = document.getElementById("dots-canvas");
  const ctx = canvas.getContext("2d");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, dots = [];
  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  function init(){
    dots = [];
    const n = Math.min(90, Math.floor((w*h)/14000));
    for(let i=0;i<n;i++){
      dots.push({
        x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.4+0.4,
        vx:(Math.random()-0.5)*0.18, vy:(Math.random()-0.5)*0.18,
        a:Math.random()*0.4+0.12
      });
    }
  }
  function tick(){
    ctx.clearRect(0,0,w,h);
    const light = document.body.classList.contains("theme-light");
    for(const d of dots){
      d.x += d.vx; d.y += d.vy;
      if(d.x < 0) d.x = w; if(d.x > w) d.x = 0;
      if(d.y < 0) d.y = h; if(d.y > h) d.y = 0;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
      ctx.fillStyle = light ? `rgba(12,28,77,${d.a*0.5})` : `rgba(255,255,255,${d.a})`;
      ctx.fill();
    }
    if(!reduce) requestAnimationFrame(tick);
  }
  window.addEventListener("resize", ()=>{ resize(); init(); });
  resize(); init(); tick();
})();

/* ================== ISHGA TUSHIRISH ================== */
applyTheme();
navStack.push({ name:"home", opts:{} });

/* Agar sayt push-bildirishnoma orqali ochilgan bo'lsa (masalan
   "/#myVisaStatus"), mijozni to'g'ridan-to'g'ri kerakli ekranga olib
   boramiz — u bosh sahifadan qidirib yurmasin. Bosh sahifa navStack'da
   qolgani uchun "Orqaga" tugmasi ham odatdagidek ishlayveradi. */
/* Ilova ALLAQACHON ochiq bo'lganda push bosilsa — Service Worker shu
   xabarni yuboradi va biz kerakli ekranga darhol o'tamiz (sahifani qayta
   yuklamasdan). */
if("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("message", (event)=>{
    const d = event.data;
    if(!d || d.type !== "OPEN_SCREEN" || !d.url) return;
    const m = String(d.url).match(/#(\w+)/);
    if(!m) return;
    const allowed = ["myVisaStatus", "viza", "vizaForm", "news", "addresses", "help"];
    if(allowed.indexOf(m[1]) === -1) return;
    go(m[1], {});
  });
}

(function openFromHash(){
  const raw = (location.hash || "").replace(/^#/, "").trim();
  if(!raw) return;
  // Faqat ruxsat etilgan ekranlar — tasodifiy/zararli qiymatlar o'tmaydi.
  const allowed = ["myVisaStatus", "viza", "vizaForm", "news", "addresses", "help"];
  if(allowed.indexOf(raw) === -1) return;
  navStack.push({ name: raw, opts: {} });
  // Manzildagi belgini tozalaymiz, shunda sahifa yangilanganda takror
  // o'sha ekranga sakramaydi.
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(e){}
})();

render();

/* ===== HOLAT O'ZGARSA — AVTOMATIK OCHISH =====
   iOS'da push bosilganda ilova ba'zan manzildagi "#myVisaStatus" belgisini
   e'tiborsiz qoldirib, oddiy bosh sahifadan ochiladi (Apple cheklovi —
   ilova har doim manifestdagi start_url'dan boshlanadi). Shuning uchun
   manzilga TAYANMAYDIGAN ishonchli yo'l qo'shamiz: ilova ochilganda o'z
   so'rovlarimiz holatini tekshiramiz va agar u oxirgi ko'rganimizdan
   O'ZGARGAN bo'lsa (masalan "tayyor" bo'lgan), holat ekranini o'zi ochamiz.
   Bu push bosilganda ham, oddiy ochilganda ham bir xil ishonchli ishlaydi. */
/* ===== HOLAT O'ZGARSA — AVTOMATIK OCHISH =====
   iPhone'da ikki xil holat bor va IKKALASINI ham qamrab olishimiz kerak:
     1) Ilova YOPIQ edi -> push bosilganda yangidan ochiladi. Apple manzildagi
        "#myVisaStatus" belgisini e'tiborsiz qoldiradi (ilova har doim
        manifestdagi start_url'dan boshlanadi), shuning uchun manzilga
        tayanmaymiz.
     2) Ilova FONDA turgan edi -> push bosilganda u QAYTA YUKLANMAYDI, faqat
        ekranga qaytadi. Bunda sahifa kodi qaytadan ishga tushmaydi — aynan
        shu sabab avval hech narsa ochilmasdi.
   Yechim: holatni ilova ochilganda HAM, ekranga har qaytganda HAM
   tekshiramiz. */
function checkVisaStatusChange(){
  const ids = myVisaIds();
  if(!ids.length) return;
  // Allaqachon holat ekranida bo'lsak — takror ochish kerak emas.
  const top = navStack[navStack.length - 1]?.name;
  if(top === "myVisaStatus") return;
  // Mijoz boshqa ish qilayotgan bo'lsa (forma to'ldirayotgan bo'lsa)
  // xalaqit bermaymiz — faqat bosh sahifada turganda ochamiz.
  if(top !== "home") return;

  fetchVisa().then(list=>{
    const seen = seenStatuses();
    const changed = list.some(v=>{
      if(!ids.includes(v.id)) return false;
      // Mijoz holat ekranini hali birinchi marta ochmagan bo'lishi mumkin —
      // bunda so'rov yuborilgandagi boshlang'ich holat "new" deb olinadi.
      const prev = (seen[v.id] === undefined) ? "new" : seen[v.id];
      return prev !== v.status;
    });
    if(!changed) return;
    if(navStack[navStack.length - 1]?.name !== "home") return;
    go("myVisaStatus", {});
  }).catch(()=>{});
}

// 1) Ilova ochilganda
checkVisaStatusChange();

// 2) Ilova ekranga qaytganda (fondan tiklanganda) — push bosilgan holat
//    aynan shu yerga tushadi.
document.addEventListener("visibilitychange", ()=>{
  if(document.visibilityState === "visible") checkVisaStatusChange();
});
// Ba'zi iOS versiyalarida "visibilitychange" o'rniga "pageshow"/"focus"
// ishonchliroq ishlaydi — ikkalasini ham qo'shamiz (takror chaqirilsa ham
// zarari yo'q, chunki funksiya o'zi holatni qayta tekshiradi).
window.addEventListener("pageshow", ()=> checkVisaStatusChange());
window.addEventListener("focus", ()=> checkVisaStatusChange());
</script>
