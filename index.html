<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Omad Tour</title>
<style>
  :root{
    --bg-1:#050d2b;
    --bg-2:#0a1a4d;
    --bg-3:#123073;
    --glass:rgba(255,255,255,0.09);
    --glass-border:rgba(255,255,255,0.22);
    --glass-hover:rgba(255,255,255,0.16);
    --text:#e9eefb;
    --text-dim:#b8c4e6;
    --accent-red:#e8354f;
    --accent-red-dark:#c22440;
    --radius:20px;
    --plane-color:#fff;
    --shimmer-1:#e9eefb;
    --shimmer-2:#9fc4ff;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  }
  body.theme-light{
    --bg-1:#eef2fb;
    --bg-2:#dde6f8;
    --bg-3:#c9d9f5;
    --glass:rgba(10,26,77,0.055);
    --glass-border:rgba(10,26,77,0.16);
    --glass-hover:rgba(10,26,77,0.1);
    --text:#0c1c4d;
    --text-dim:#4c5a86;
    --plane-color:#0c1c4d;
    --shimmer-1:#0c1c4d;
    --shimmer-2:#5c85e0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg-1);}
  body{
    color:var(--text);
    background:
      radial-gradient(circle at 18% 12%, rgba(30,70,180,.55), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(10,30,90,.6), transparent 50%),
      radial-gradient(circle at 20% 20%, var(--bg-3), var(--bg-2) 45%, var(--bg-1) 100%);
    position:relative;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  #dots-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}

  #app{position:relative;z-index:1;height:100vh;width:100vw;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden;}

  .screen{
    position:absolute;inset:0;
    display:none;
    flex-direction:column;
    padding:18px 18px 28px;
    overflow-y:auto;
  }
  .screen.active{display:flex;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;min-height:40px;}
  .topbar .spacer{flex:1;}

  .back-btn{
    background:var(--accent-red);
    color:#fff;border:none;border-radius:14px;
    padding:8px 16px;font-size:15px;font-weight:600;
    cursor:pointer; box-shadow:0 4px 14px rgba(230,50,80,.35);
    display:flex;align-items:center;gap:6px;
  }
  .back-btn:active{background:var(--accent-red-dark);}

  .lang-switch{display:flex;gap:6px;}
  .lang-btn{
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:var(--text);border-radius:12px;
    padding:6px 10px;font-size:13px;font-weight:600;
    cursor:pointer;display:flex;align-items:center;gap:4px;
  }
  .lang-btn.active{background:var(--glass-hover);border-color:#fff;}

  .logo-wrap{display:flex;justify-content:center;margin:6px 0 18px;}
  .logo-circle{
    width:104px;height:104px;border-radius:50%;
    overflow:hidden;border:3px solid #8c2464;
    box-shadow:0 8px 26px rgba(0,0,0,.35);
    background:#fff;display:flex;align-items:center;justify-content:center;
    padding:16px;
  }
  .logo-circle img{width:100%;height:100%;object-fit:contain;}

  .greeting{
    text-align:center;font-size:16px;line-height:1.5;
    margin:0 6px 22px;font-weight:600;
    background:linear-gradient(100deg, var(--shimmer-1) 30%, var(--shimmer-2) 50%, var(--shimmer-1) 70%);
    background-size:220% auto;
    -webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shimmer 5s linear infinite;
  }
  @keyframes shimmer{ 0%{background-position:0% 0;} 100%{background-position:-220% 0;} }

  .menu-list{display:flex;flex-direction:column;gap:12px;margin-top:auto;margin-bottom:6px;}
  .home-scroll{flex:1;display:flex;flex-direction:column;overflow-y:auto;}

  .glass-btn{
    background:var(--glass);
    border:1px solid var(--glass-border);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    color:var(--text);
    border-radius:var(--radius);
    padding:16px 18px;font-size:16px;font-weight:600;
    display:flex;align-items:center;gap:12px;
    cursor:pointer;text-align:left;
    transition:background .15s ease;
    box-shadow:0 6px 20px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.12);
    position:relative;overflow:hidden;
  }
  .ripple{
    position:absolute;border-radius:50%;
    background:rgba(255,255,255,.35);
    transform:scale(0);
    animation:rippleAnim .55s ease-out;
    pointer-events:none;
  }
  @keyframes rippleAnim{ to{ transform:scale(2.6); opacity:0; } }
  .glass-btn:active{background:var(--glass-hover);}
  .glass-btn .icon-circle{flex-shrink:0;}
  .glass-btn .label{flex:1;}
  .glass-btn .arrow{opacity:.6;font-size:18px;}
  .glass-btn .label-col{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
  .glass-btn .label-col .label{font-size:16px;font-weight:700;}
  .glass-btn .label-col .sub{font-size:12px;font-weight:500;color:var(--text-dim);white-space:normal;line-height:1.3;}
  .glass-btn::before{
    content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:3px;
    background:var(--accent-c, transparent);opacity:.85;
  }
  .accent-1{ --accent-c:#4fa8ff; }
  .accent-2{ --accent-c:#ffca4f; }
  .accent-3{ --accent-c:#4fe0c4; }
  .accent-4{ --accent-c:#c58bff; }
  .accent-5{ --accent-c:#ff7fae; }
  .accent-6{ --accent-c:#7cff9e; }
  .glass-btn-red{
    background:rgba(232,53,79,.14); border-color:rgba(232,53,79,.5);
  }
  .glass-btn-red::before{ background:var(--accent-red); opacity:1; }
  .glass-btn-red:active{ background:rgba(232,53,79,.24); }
  .attention-pulse{
    text-align:center;font-weight:700;font-size:14.5px;color:#ffd9df;
    padding:10px 14px;margin-bottom:16px;border-radius:12px;
    background:rgba(232,53,79,.12);border:1px solid rgba(232,53,79,.4);
    animation:attentionPulse 1.6s ease-in-out infinite;
  }
  @keyframes attentionPulse{ 0%,100%{opacity:1;} 50%{opacity:.45;} }

  .help-textarea-wrap{position:relative;}
  .help-textarea-wrap textarea{padding-bottom:44px;}
  .help-attach-btn{
    position:absolute;bottom:12px;right:12px;
    width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.14);border:1px solid var(--glass-border);
    color:var(--text);cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .help-attach-btn svg{width:17px;height:17px;}
  .help-attach-thumb{
    position:absolute;bottom:10px;right:10px;width:38px;height:38px;
    border-radius:8px;object-fit:cover;border:1px solid var(--glass-border);
  }

  .icon-circle{
    width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.12);
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .icon-circle svg{width:19px;height:19px;}

  .section-text{
    font-size:14.5px;line-height:1.55;color:var(--text-dim);
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:16px;padding:14px 16px;margin-bottom:18px;
  }

  h2.title{font-size:18px;margin:0 0 14px;font-weight:700;text-align:center;}

  .list-col{display:flex;flex-direction:column;gap:10px;}

  .airport-sub{display:flex;flex-direction:column;gap:8px;margin:4px 0 4px 14px;}
  .airport-sub .glass-btn{padding:11px 14px;font-size:14px;}

  input[type="text"], input[type="tel"], textarea{
    width:100%;background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:14px;color:var(--text);padding:16px 14px;font-size:17px;font-weight:600;
    margin-bottom:6px;font-family:inherit;
  }
  textarea{min-height:120px;resize:vertical;}
  input::placeholder, textarea::placeholder{color:var(--text-dim);opacity:.7;}
  .required-star{color:var(--accent-red);font-weight:800;margin-left:4px;}
  .field-label{font-size:14px;font-weight:600;margin:12px 0 6px;}
  .error-msg{color:var(--accent-red);font-size:12.5px;margin:-2px 0 10px;display:none;}

  .upload-box{
    width:100%;min-height:110px;
    background:var(--glass);border:2px dashed var(--glass-border);
    border-radius:16px;margin-bottom:6px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:border-color .15s ease, background .15s ease;
  }
  .upload-box:active{background:var(--glass-hover);}
  .upload-empty{
    display:flex;flex-direction:column;align-items:center;gap:8px;
    color:var(--text-dim);font-size:14px;font-weight:600;padding:20px;text-align:center;
  }
  .upload-folder-icon{font-size:30px;opacity:.85;}
  .upload-preview{
    width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;position:relative;
  }
  .upload-preview img{
    width:64px;height:64px;object-fit:cover;border-radius:10px;border:1px solid var(--glass-border);flex-shrink:0;
  }
  .upload-info{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;}
  .upload-info span#uploadFileName{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .upload-filesize{font-size:12px;color:var(--text-dim);}
  .upload-remove{
    background:var(--accent-red);color:#fff;border:none;border-radius:50%;
    width:26px;height:26px;font-size:13px;cursor:pointer;flex-shrink:0;
  }

  .primary-btn{
    background:var(--accent-red);color:#fff;border:none;border-radius:16px;
    padding:14px;font-size:15.5px;font-weight:700;cursor:pointer;
    box-shadow:0 6px 18px rgba(230,50,80,.35);margin-top:6px;
  }
  .primary-btn:active{background:var(--accent-red-dark);}
  .primary-btn:disabled{opacity:.5;}

  /* Calendar */
  .calendar-card{
    background:#fff;color:#222;border-radius:22px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.4);
  }
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-nav-btn{background:none;border:none;font-size:20px;color:#5c1338;cursor:pointer;padding:4px 10px;}
  .cal-month-label{font-weight:700;font-size:15.5px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
  .cal-dow{font-size:11.5px;color:#999;font-weight:600;padding:4px 0;}
  .cal-day{padding:9px 0;border-radius:10px;font-size:14px;cursor:pointer;}
  .cal-day.empty{visibility:hidden;}
  .cal-day:hover{background:#f1e0e8;}
  .cal-day.selected{background:var(--accent-red);color:#fff;font-weight:700;}
  .cal-day.past{opacity:.3;pointer-events:none;}

  /* contact */
  .contact-summary{
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:16px;padding:14px;margin-bottom:16px;font-size:14.5px;line-height:1.6;
  }
  .contact-list{display:flex;flex-direction:column;gap:10px;}

  .addr-block{
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:16px;padding:14px 16px;margin-bottom:14px;font-size:14.5px;line-height:1.6;
    animation:fadeUp .5s ease;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);} to{opacity:1;transform:translateY(0);}}

  .footer-note{font-size:11.5px;color:var(--text-dim);text-align:center;margin-top:16px;opacity:.7;}

  .bell-btn{
    position:relative;background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:var(--text);border-radius:12px;padding:8px 13px;font-size:16px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .bell-btn svg{width:19px;height:19px;display:block;}
  .inline-icon{display:inline-block;width:18px;height:18px;vertical-align:-4px;}
  .inline-icon svg{width:100%;height:100%;display:block;}
  .bell-btn .badge{
    position:absolute;top:-6px;right:-6px;background:var(--accent-red);color:#fff;
    font-size:10.5px;font-weight:800;border-radius:10px;min-width:17px;height:17px;
    display:flex;align-items:center;justify-content:center;padding:0 3px;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }
  .news-item{
    display:flex;align-items:center;gap:12px;cursor:pointer;
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:14px;padding:10px 14px;margin-bottom:10px;font-size:14px;line-height:1.4;
  }
  .news-item:active{ background:var(--glass-hover); }
  .news-thumb{
    width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;
    border:1px solid var(--glass-border);
  }
  .news-thumb-placeholder{
    display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(255,255,255,.08);
  }
  .news-thumb-placeholder svg{width:20px;height:20px;}
  .news-row-text{flex:1;min-width:0;overflow:hidden;}
  .news-row-text .news-date{font-size:11.5px;color:var(--text-dim);margin-bottom:2px;display:block;}
  .admin-row{
    display:flex;align-items:center;gap:10px;background:var(--glass);border:1px solid var(--glass-border);
    border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:13.5px;
  }
  .admin-row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .admin-row .del-btn{background:var(--accent-red);color:#fff;border:none;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;flex-shrink:0;}
  .admin-row .view-btn{background:rgba(255,255,255,.15);color:var(--text);border:none;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;flex-shrink:0;text-decoration:none;}
  .admin-row-thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;flex-shrink:0;border:1px solid var(--glass-border);}

  .story-overlay{
    position:fixed;inset:0;z-index:50;background:#000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    animation:storyFadeIn .2s ease;
  }
  @keyframes storyFadeIn{ from{opacity:0;} to{opacity:1;} }
  .story-progress{
    position:absolute;top:12px;left:12px;right:12px;height:3px;
    background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden;z-index:2;
  }
  .story-progress-bar{
    height:100%;width:0%;background:#fff;border-radius:3px;
    transition:width 5s linear;
  }
  .story-close{
    position:absolute;top:24px;left:14px;z-index:2;
    background:rgba(255,255,255,.18);color:#fff;border:none;border-radius:50%;
    width:34px;height:34px;font-size:16px;cursor:pointer;
  }
  .story-img{max-width:100%;max-height:78vh;object-fit:contain;}
  .story-noimg{width:80px;height:80px;color:#fff;opacity:.8;}
  .story-noimg svg{width:100%;height:100%;}
  .story-caption{
    color:#fff;font-size:15px;line-height:1.5;text-align:center;
    padding:18px 24px;max-width:520px;
    background:linear-gradient(0deg, rgba(0,0,0,.6), transparent);
    position:absolute;bottom:0;left:0;right:0;padding-top:60px;
  }

  .fly-plane{
    position:fixed;top:8%;left:-8%;z-index:0;pointer-events:none;
    width:26px;height:26px;opacity:.55;color:var(--plane-color);
    animation:flyAcross 16s linear infinite;
    filter:drop-shadow(0 0 6px rgba(0,0,0,.2));
  }
  @keyframes flyAcross{
    0%{ transform:translate(0,0) rotate(28deg); opacity:0; }
    8%{ opacity:.55; }
    92%{ opacity:.55; }
    100%{ transform:translate(130vw, 55vh) rotate(28deg); opacity:0; }
  }

  .iframe-wrap{flex:1;background:#fff;border-radius:16px 16px 0 0;overflow:hidden;margin:8px 0 10px;min-height:0;}
  .iframe-wrap iframe{width:100%;height:100%;border:none;display:block;}

  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.25);border-radius:10px;}
</style>

</script>
</head>

  try{ localStorage.setItem("omad_cache_"+key, JSON.stringify(value)); }catch(e){}
}
async function kvGetJSON(key, fallback){
  const bucket = activeBucket();
  if(!bucket) return kvCacheGet(key, fallback);
  try{
    const res = await fetch(`https://kvdb.io/${bucket}/${key}`);
    if(res.status === 404) return kvCacheGet(key, fallback);
    if(!res.ok) return kvCacheGet(key, fallback);
    const text = await res.text();
    const parsed = text ? JSON.parse(text) : fallback;
    kvCacheSet(key, parsed);
    return parsed;
  }catch(e){ return kvCacheGet(key, fallback); }
}
async function kvSetJSON(key, value){
  kvCacheSet(key, value); // always keep a local copy, so nothing is ever silently lost
  const bucket = activeBucket();
  if(!bucket) return false; // saved locally only — won't be visible to other visitors/devices until a shared bucket exists
  try{
    await fetch(`https://kvdb.io/${bucket}/${key}`, { method:"PUT", body: JSON.stringify(value) });
    return true;
  }catch(e){ return false; }
}

/* ---- News list ---- */
async function fetchNewsList(){ return await kvGetJSON("news_list", []); }
async function addNewsItem(text, imageUrl){
  const list = await fetchNewsList();
  list.unshift({ id: Date.now(), text, imageUrl: imageUrl || "", date: new Date().toLocaleDateString("uz-UZ") });
  return await kvSetJSON("news_list", list);
}
async function deleteNewsItem(id){
  const list = await fetchNewsList();
  const filtered = list.filter(n => n.id !== id);
  return await kvSetJSON("news_list", filtered);
}
function getNewsSeenCount(){ try{ return parseInt(localStorage.getItem("omad_news_seen")||"0"); }catch(e){ return 0; } }
function setNewsSeenCount(n){ try{ localStorage.setItem("omad_news_seen", String(n)); }catch(e){} }

async function uploadToImgbb(file){
  const fd = new FormData();
  fd.append("image", file);
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method:"POST", body: fd });
  const data = await res.json();
  if(data && data.data && data.data.url) return data.data.url;
  throw new Error("upload failed");
}
async function fetchVisaSubmissions(){ return await kvGetJSON("visa_submissions", []); }

  const list = await fetchVisaSubmissions();

  return await kvSetJSON("visa_submissions", list);
}
async function deleteVisaSubmission(id){

  return await kvSetJSON("visa_submissions", filtered);
}

function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function calendarInnerHTML(){
  const y = state.calYear, m = state.calMonth;
  const first = new Date(y,m,1).getDay(); // 0=Sun
  const offset = (first+6)%7; // make Monday first
  const total = daysInMonth(y,m);
  const today = new Date(); today.setHours(0,0,0,0);
  let cells = "";
  for(let i=0;i<offset;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=total; d++){
    const thisDate = new Date(y,m,d);
    const isPast = thisDate < today;
    const isSel = state.date && state.date.getFullYear()===y && state.date.getMonth()===m && state.date.getDate()===d;
    cells += `<div class="cal-day ${isPast?'past':''} ${isSel?'selected':''}" data-day="${d}">${d}</div>`;
  }
  const dow = t('dow').map(d=>`<div class="cal-dow">${d}</div>`).join("");
  return `<div class="cal-head">
        <button class="cal-nav-btn" id="prevMonth">‹</button>
        <div class="cal-month-label">${t('mon')[m]} ${y}</div>
        <button class="cal-nav-btn" id="nextMonth">›</button>
      </div>
      <div class="cal-grid">${dow}${cells}</div>`;
}

/* ---------------- EVENTS ---------------- */
function bindEvents(name, opts){
  document.querySelectorAll(".glass-btn").forEach(btn=>{
    btn.addEventListener("click", function(e){
      const rect = btn.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      const ripple = document.createElement("span");
      ripple.className = "ripple";
      ripple.style.width = ripple.style.height = size + "px";
      ripple.style.left = (e.clientX - rect.left - size/2) + "px";
      ripple.style.top = (e.clientY - rect.top - size/2) + "px";
      btn.appendChild(ripple);
      setTimeout(()=> ripple.remove(), 600);
    });
  });
  document.getElementById("backBtn")?.addEventListener("click", goBack);
  document.querySelectorAll(".lang-btn").forEach(b=>{
    b.addEventListener("click", ()=> setLang(b.dataset.lang));
  });
  document.querySelectorAll("[data-go]").forEach(b=>{
    b.addEventListener("click", (e)=>{
      const go = b.dataset.go;
      if(go==="cityStep"){ pushScreen("cityStep", {direction:b.dataset.direction, step: parseInt(b.dataset.step)}); }
      else if(go==="otherCountry"){ pushScreen("otherCountry", {step:0}); }
      else { pushScreen(go, {}); }
    });
  });

  if(name==="cityStep"){
    document.querySelectorAll("[data-expand]").forEach(b=>{
      b.addEventListener("click",(e)=>{
        e.stopPropagation();
        const sub = document.getElementById("sub-"+b.dataset.expand);
        if(sub){ sub.style.display = sub.style.display==="none" ? "flex" : "none"; }
      });
    });
    document.querySelectorAll("[data-city]").forEach(b=>{
      b.addEventListener("click",(e)=>{
        if(b.hasAttribute("data-expand")) return; // handled by expand toggle
        const direction = opts.direction, step = opts.step;
        if(step===0){
          if(direction==="ru-uz") state.fromCity = b.dataset.city; else state.fromCity = b.dataset.city;
          state.direction = direction;
          pushScreen("cityStep", {direction, step:1});
        } else {
          state.toCity = b.dataset.city;
          pushScreen("calendar", {});
        }
      });
    });
  }

  if(name==="otherCountry"){
    state.direction = "other";
    if(opts.step===0){
      document.getElementById("otherNextBtn").addEventListener("click", ()=>{
        const val = document.getElementById("fromInput").value.trim();
        if(!val){ document.getElementById("fromErr").style.display="block"; return; }
        state.fromCustom = val;
        pushScreen("otherCountry", {step:1});
      });
    } else {
      document.getElementById("otherNextBtn2").addEventListener("click", ()=>{
        const val = document.getElementById("toInput").value.trim();
        if(!val){ document.getElementById("toErr").style.display="block"; return; }
        state.toCustom = val;
        pushScreen("calendar", {});
      });
    }
  }

  if(name==="calendar"){
    bindCalendarEvents();
  }

  if(name==="contact"){
    document.getElementById("contactMaxBtn")?.addEventListener("click", ()=>{
      try{ navigator.clipboard?.writeText(lastContactSummary); }catch(e){}
    });
  }

  if(name==="viza"){
    document.getElementById("expertsToggle")?.addEventListener("click", ()=>{
      const list = document.getElementById("expertsList");
      const arrow = document.getElementById("expertsArrow");
      const open = list.style.display !== "none";
      list.style.display = open ? "none" : "flex";
      arrow.textContent = open ? "▾" : "▴";
    });
  }

  if(name==="help"){
    const helpFileInput = document.getElementById("helpFileInput");
    const helpAttachBtn = document.getElementById("helpAttachBtn");
    const helpAttachThumb = document.getElementById("helpAttachThumb");
    helpAttachBtn.addEventListener("click", ()=> helpFileInput.click());
    helpAttachThumb.addEventListener("click", ()=> helpFileInput.click());
    helpFileInput.addEventListener("change", ()=>{
      const file = helpFileInput.files[0];
      if(!file) return;
      const reader = new FileReader();
      reader.onload = (e)=>{ helpAttachThumb.src = e.target.result; };
      reader.readAsDataURL(file);
      helpAttachThumb.style.display = "block";
      helpAttachBtn.style.display = "none";
    });

    document.getElementById("helpSendBtn").addEventListener("click", async ()=>{
      const val = document.getElementById("helpInput").value.trim();
      if(!val){ document.getElementById("helpErr").style.display="block"; return; }
      const btn = document.getElementById("helpSendBtn");
      const status = document.getElementById("helpStatus");
      const file = helpFileInput.files[0];
      let bodyText = val;
      if(file){
        btn.disabled = true; btn.textContent = t('loading');

          const url = await uploadToImgbb(file);

function formatSize(bytes){
  if(bytes < 1024) return bytes + " B";
  if(bytes < 1024*1024) return (bytes/1024).toFixed(2) + " KB";
  return (bytes/(1024*1024)).toFixed(2) + " MB";
}
function formatRuPhone(raw){
  let digits = raw.replace(/\D/g,"");
  if(digits.startsWith("8")) digits = "7" + digits.slice(1);
  if(!digits.startsWith("7")) digits = "7" + digits;
  digits = digits.slice(0,11);
  const d = digits.slice(1);
  let out = "+7";
  if(d.length>0) out += " " + d.slice(0,3);
  if(d.length>=4) out += " " + d.slice(3,6);
  if(d.length>=7) out += "-" + d.slice(6,8);
  if(d.length>=9) out += "-" + d.slice(8,10);
  return out;
}
function wireDropzone(prefix){
  const fileInput = document.getElementById(prefix+"FileInput");
  const box = document.getElementById(prefix+"Box");
  const empty = document.getElementById(prefix+"Empty");
  const preview = document.getElementById(prefix+"Preview");
  const thumb = document.getElementById(prefix+"Thumb");
  const nameEl = document.getElementById(prefix+"FileName");
  const sizeEl = document.getElementById(prefix+"FileSize");
  const removeBtn = document.getElementById(prefix+"RemoveBtn");
  const errEl = document.getElementById(prefix+"FileErr");

  function showPreview(file){
    const reader = new FileReader();
    reader.onload = (e)=>{ thumb.src = e.target.result; };
    reader.readAsDataURL(file);
    nameEl.textContent = file.name;
    sizeEl.textContent = formatSize(file.size);
    empty.style.display = "none";
    preview.style.display = "flex";
    if(errEl) errEl.style.display = "none";
  }
  function clear(){
    fileInput.value = "";
    empty.style.display = "flex";
    preview.style.display = "none";
    thumb.src = "";
  }
  box.addEventListener("click", (e)=>{
    if(e.target === removeBtn) return;
    fileInput.click();
  });
  fileInput.addEventListener("change", ()=>{
    if(fileInput.files[0]) showPreview(fileInput.files[0]);
  });
  removeBtn.addEventListener("click", (e)=>{ e.stopPropagation(); clear(); });

  return { getFile: ()=> fileInput.files[0] || null, clear };
}

    el.addEventListener("click", ()=>{
      state.date = new Date(state.calYear, state.calMonth, parseInt(el.dataset.day));
      pushScreen("contact", {});

  });
}

    h = canvas.height = window.innerHeight;
  }
  function initDots(){
    dots = [];
    const count = Math.floor((w*h)/9000);
    for(let i=0;i<count;i++){
      dots.push({
        x:Math.random()*w, y:Math.random()*h,
        r:Math.random()*1.6+0.4,
        vx:(Math.random()-0.5)*0.25,
        vy:(Math.random()-0.5)*0.25,
        a:Math.random()*0.5+0.15
      });
    }
  }
  function tick(){
    ctx.clearRect(0,0,w,h);
    dots.forEach(d=>{
      d.x+=d.vx; d.y+=d.vy;
      if(d.x<0) d.x=w; if(d.x>w) d.x=0;
      if(d.y<0) d.y=h; if(d.y>h) d.y=0;
      ctx.beginPath();
      ctx.arc(d.x,d.y,d.r,0,Math.PI*2);
      ctx.fillStyle = document.body.classList.contains("theme-light") ? `rgba(12,28,77,${d.a*0.6})` : `rgba(255,255,255,${d.a})`;
      ctx.fill();
    });
    requestAnimationFrame(tick);
  }
  window.addEventListener("resize", ()=>{ resize(); initDots(); });
  resize(); initDots(); tick();
})();

/* ---------------- INIT ---------------- */
applyTheme();
history.push({name:"home"});
render();
</script>
</body>
</html>
