<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04060b">
<title>Omad Tour</title>
<style>
  /* ===================== THEME TOKENS ===================== */
  :root{
    /* DARK (haqiqiy qora) */
    --bg-1:#04060b;
    --bg-2:#0a0e16;
    --bg-3:#101725;
    --glow-1:rgba(140,160,210,.10);
    --glow-2:rgba(232,53,79,.09);

    --glass:rgba(255,255,255,.055);
    --glass-border:rgba(255,255,255,.13);
    --glass-hover:rgba(255,255,255,.11);

    --text:#eef2f9;
    --text-dim:#9fa9bf;

    --icon:#eef2f9;
    --icon-bg:rgba(255,255,255,.09);

    --surface:#111826;
    --surface-text:#eef2f9;
    --surface-line:rgba(255,255,255,.10);
    --surface-hover:rgba(255,255,255,.08);

    --accent-red:#e8354f;
    --accent-red-dark:#c22440;
    --accent-soft:#ffd0d8;

    --ripple:rgba(255,255,255,.26);
    --shadow:0 10px 30px rgba(0,0,0,.55);
    --shadow-sm:0 4px 14px rgba(0,0,0,.4);

    --radius:20px;

    font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  }
  body.theme-light{
    --bg-1:#eef2fb;
    --bg-2:#e2eaf8;
    --bg-3:#d3e0f6;
    --glow-1:rgba(80,120,220,.14);
    --glow-2:rgba(232,53,79,.08);

    --glass:rgba(12,28,77,.05);
    --glass-border:rgba(12,28,77,.14);
    --glass-hover:rgba(12,28,77,.09);

    --text:#0c1c4d;
    --text-dim:#526089;

    --icon:#0c1c4d;
    --icon-bg:rgba(12,28,77,.08);

    --surface:#ffffff;
    --surface-text:#1a2440;
    --surface-line:rgba(12,28,77,.10);
    --surface-hover:rgba(12,28,77,.06);

    --accent-soft:#8a1c30;

    --ripple:rgba(12,28,77,.14);
    --shadow:0 10px 28px rgba(20,40,90,.14);
    --shadow-sm:0 4px 12px rgba(20,40,90,.12);
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:var(--bg-1);}
  body{
    color:var(--text);
    background:
      radial-gradient(900px 600px at 15% -8%, var(--glow-1), transparent 60%),
      radial-gradient(800px 560px at 95% 108%, var(--glow-2), transparent 60%),
      linear-gradient(180deg, var(--bg-3) 0%, var(--bg-2) 45%, var(--bg-1) 100%);
    background-attachment:fixed;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    transition:background-color .25s ease,color .25s ease;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important;transition:none!important;}
  }

  #dots-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;}

  #app{
    position:relative;z-index:1;height:100dvh;width:100vw;max-width:520px;margin:0 auto;
    display:flex;flex-direction:column;overflow:hidden;
  }
  @media (min-width:900px){
    body{display:flex;align-items:center;justify-content:center;}
    #app{
      max-width:1000px;height:88vh;max-height:900px;
      border-radius:28px;box-shadow:var(--shadow);
      border:1px solid var(--glass-border);
    }
    .home-scroll{padding:0 6vw;}
    .menu-list{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
    .greeting{font-size:19px;max-width:640px;margin-left:auto;margin-right:auto;}
    .screen{padding-left:8vw;padding-right:8vw;}
  }

  .screen{
    position:absolute;inset:0;display:none;flex-direction:column;
    padding:max(16px,env(safe-area-inset-top)) 18px 28px;
    overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .screen.active{display:flex;}

  .topbar{display:flex;align-items:center;gap:8px;margin-bottom:14px;min-height:40px;}
  .topbar .spacer{flex:1;}

  .back-btn{
    background:var(--accent-red);color:#fff;border:none;border-radius:14px;
    padding:9px 16px;font-size:15px;font-weight:600;cursor:pointer;
    box-shadow:0 4px 14px rgba(232,53,79,.32);
    display:inline-flex;align-items:center;gap:6px;
  }
  .back-btn:active{background:var(--accent-red-dark);transform:translateY(1px);}

  .lang-switch{display:flex;gap:6px;}
  .lang-btn{
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:var(--text);border-radius:12px;padding:7px 10px;font-size:13px;font-weight:700;
    cursor:pointer;letter-spacing:.02em;
  }
  .lang-btn.active{background:var(--glass-hover);border-color:var(--text-dim);}

  .icon-btn{
    position:relative;background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    color:var(--icon);border-radius:13px;padding:10px 13px;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
  }
  .icon-btn svg{width:23px;height:23px;display:block;}
  .icon-btn .badge{
    position:absolute;top:-6px;right:-6px;background:var(--accent-red);color:#fff;
    font-size:10.5px;font-weight:800;border-radius:10px;min-width:18px;height:18px;
    display:flex;align-items:center;justify-content:center;padding:0 4px;
    box-shadow:0 2px 6px rgba(0,0,0,.4);
  }

  .logo-wrap{display:flex;justify-content:center;margin:4px 0 16px;}
  .logo-circle{
    width:132px;height:132px;border-radius:50%;overflow:hidden;
    border:3px solid rgba(232,53,79,.5);
    box-shadow:var(--shadow);
    background:#fdfdff;display:flex;align-items:center;justify-content:center;padding:20px;
  }
  .logo-circle img{width:100%;height:100%;object-fit:contain;}

  .greeting{
    text-align:center;font-size:16px;line-height:1.55;margin:0 6px 22px;font-weight:600;
    color:var(--text);
  }

  .home-scroll{flex:1;display:flex;flex-direction:column;overflow-y:auto;}
  .menu-list{display:flex;flex-direction:column;gap:12px;margin-top:auto;margin-bottom:6px;}

  .glass-btn{
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    color:var(--text);border-radius:var(--radius);
    padding:15px 16px;font-size:16px;font-weight:600;
    display:flex;align-items:center;gap:14px;cursor:pointer;text-align:left;
    text-decoration:none;
    transition:background .15s ease,transform .1s ease;
    box-shadow:var(--shadow-sm);
    position:relative;overflow:hidden;width:100%;
    font-family:inherit;
  }
  .glass-btn:active{background:var(--glass-hover);transform:translateY(1px);}
  .glass-btn:focus-visible{outline:2px solid var(--accent-red);outline-offset:2px;}
  .glass-btn .label{flex:1;min-width:0;}
  .glass-btn .arrow{opacity:.55;font-size:18px;flex-shrink:0;}
  .glass-btn .label-col{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0;}
  .glass-btn .label-col .label{font-size:16px;font-weight:700;}
  .glass-btn .label-col .sub{font-size:12px;font-weight:500;color:var(--text-dim);line-height:1.35;}
  .glass-btn::before{
    content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;
    background:var(--accent-c,transparent);
  }
  .accent-1{--accent-c:#4fa8ff;}
  .accent-2{--accent-c:#f5b52e;}
  .accent-3{--accent-c:#2fc9a8;}
  .accent-4{--accent-c:#a97bff;}
  .accent-5{--accent-c:#ff6f9c;}
  .accent-6{--accent-c:#48d67a;}

  .glass-btn-red{background:rgba(232,53,79,.13);border-color:rgba(232,53,79,.45);}
  .glass-btn-red::before{background:var(--accent-red);}
  .glass-btn-red:active{background:rgba(232,53,79,.22);}

  .stepper{display:flex;align-items:center;gap:14px;flex-shrink:0;}
  .stepper-btn{
    width:34px;height:34px;border-radius:50%;border:1px solid var(--glass-border);
    background:var(--glass-hover);color:var(--text);font-size:19px;font-weight:700;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    font-family:inherit;line-height:1;padding:0;
  }
  .stepper-btn:active{background:var(--accent-red);border-color:var(--accent-red);color:#fff;}
  .stepper-count{font-size:17px;font-weight:700;min-width:20px;text-align:center;}

  .trip-toggle{display:flex;gap:10px;margin-bottom:20px;}
  .trip-toggle-btn{
    flex:1;padding:14px 10px;border-radius:16px;
    border:1.5px solid var(--glass-border);background:var(--glass);
    text-align:center;font-weight:700;font-size:15px;color:var(--text);
    cursor:pointer;font-family:inherit;transition:border-color .15s,color .15s,background .15s;
  }
  .trip-toggle-btn.selected{
    border-color:var(--accent-red);color:var(--accent-red);
    background:rgba(232,53,79,.09);
  }

  .ripple{
    position:absolute;border-radius:50%;background:var(--ripple);
    transform:scale(0);animation:rippleAnim .55s ease-out;pointer-events:none;
  }
  @keyframes rippleAnim{to{transform:scale(2.6);opacity:0;}}

  .icon-circle{
    width:46px;height:46px;border-radius:50%;background:var(--icon-bg);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(--icon);
  }
  .icon-circle svg{width:24px;height:24px;display:block;}
  .inline-icon{display:inline-flex;width:21px;height:21px;vertical-align:-5px;color:var(--icon);}
  .inline-icon svg{width:100%;height:100%;}

  h2.title{font-size:18px;margin:0 0 14px;font-weight:700;text-align:center;letter-spacing:.01em;}

  .section-text{
    font-size:14.5px;line-height:1.6;color:var(--text-dim);
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:16px;padding:14px 16px;margin-bottom:18px;
  }
  .list-col{display:flex;flex-direction:column;gap:10px;}
  .airport-sub{display:flex;flex-direction:column;gap:8px;margin:4px 0 4px 14px;}
  .airport-sub .glass-btn{padding:11px 14px;font-size:14px;}

  input[type="text"],input[type="tel"],textarea{
    width:100%;background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:14px;color:var(--text);padding:15px 14px;font-size:17px;font-weight:600;
    margin-bottom:6px;font-family:inherit;
  }
  input:focus,textarea:focus{outline:none;border-color:var(--accent-red);}
  textarea{min-height:120px;resize:vertical;font-weight:500;font-size:15.5px;}
  input::placeholder,textarea::placeholder{color:var(--text-dim);opacity:.75;font-weight:500;}
  .required-star{color:var(--accent-red);font-weight:800;margin-left:4px;}
  .field-label{font-size:14px;font-weight:600;margin:12px 0 6px;}
  .error-msg{color:var(--accent-red);font-size:12.5px;margin:-2px 0 10px;display:none;}

  .upload-box{
    width:100%;min-height:108px;background:var(--glass);
    border:2px dashed var(--glass-border);border-radius:16px;margin-bottom:6px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:border-color .15s,background .15s;
  }
  .upload-box:active{background:var(--glass-hover);}
  .upload-box.ready{border-style:solid;border-color:rgba(60,200,120,.55);}
  .upload-box.failed{border-color:rgba(232,53,79,.6);}
  .upload-empty{
    display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text-dim);
    font-size:14px;font-weight:600;padding:20px;text-align:center;
  }
  .upload-empty svg{width:28px;height:28px;opacity:.8;}
  .upload-preview{width:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;}
  .upload-preview img{
    width:60px;height:60px;object-fit:cover;border-radius:10px;
    border:1px solid var(--glass-border);flex-shrink:0;
  }
  .upload-info{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;}
  .upload-info .fname{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .upload-meta{font-size:12px;color:var(--text-dim);}
  .upload-meta.ok{color:#3ec27a;font-weight:700;}
  .upload-meta.err{color:var(--accent-red);font-weight:700;}
  .upload-detail{
    display:block;font-size:11px;color:var(--text-dim);margin-top:2px;
    line-height:1.4;word-break:break-word;font-family:ui-monospace,Consolas,monospace;
  }
  .upload-remove{
    background:var(--accent-red);color:#fff;border:none;border-radius:50%;
    width:26px;height:26px;font-size:13px;cursor:pointer;flex-shrink:0;line-height:1;
  }
  .upload-bar{height:3px;border-radius:3px;background:var(--glass-border);overflow:hidden;margin-top:5px;}
  .upload-bar span{display:block;height:100%;width:0;background:var(--accent-red);transition:width .3s ease;}

  .primary-btn{
    background:var(--accent-red);color:#fff;border:none;border-radius:16px;width:100%;
    padding:15px;font-size:15.5px;font-weight:700;cursor:pointer;font-family:inherit;
    box-shadow:0 6px 18px rgba(232,53,79,.32);margin-top:6px;
  }
  .primary-btn:active{background:var(--accent-red-dark);}
  .primary-btn:disabled{opacity:.55;cursor:default;}

  .attention-pulse{
    text-align:center;font-weight:700;font-size:14.5px;color:var(--accent-soft);
    padding:10px 14px;margin-bottom:16px;border-radius:12px;
    background:rgba(232,53,79,.11);border:1px solid rgba(232,53,79,.38);
    animation:attentionPulse 1.8s ease-in-out infinite;
  }
  @keyframes attentionPulse{0%,100%{opacity:1;}50%{opacity:.5;}}

  /* Calendar */
  .calendar-card{
    background:var(--surface);color:var(--surface-text);
    border:1px solid var(--surface-line);
    border-radius:22px;padding:16px;box-shadow:var(--shadow);
  }
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-nav-btn{
    background:var(--surface-hover);border:none;font-size:20px;color:var(--surface-text);
    cursor:pointer;padding:4px 12px;border-radius:10px;line-height:1.2;
  }
  .cal-month-label{font-weight:700;font-size:15.5px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;}
  .cal-dow{font-size:11.5px;color:var(--text-dim);font-weight:700;padding:4px 0;}
  .cal-day{padding:10px 0;border-radius:10px;font-size:14px;cursor:pointer;}
  .cal-day.empty{visibility:hidden;}
  .cal-day:active{background:var(--surface-hover);}
  .cal-day.today{border:1px solid var(--accent-red);}
  .cal-day.selected{background:var(--accent-red);color:#fff;font-weight:700;}
  .cal-day.past{opacity:.28;pointer-events:none;}

  .contact-summary{
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:16px;padding:14px;margin-bottom:16px;font-size:14.5px;line-height:1.65;
  }
  .addr-block{
    background:var(--glass);border:1px solid var(--glass-border);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-radius:16px;padding:14px 16px;margin-bottom:16px;font-size:14.5px;line-height:1.6;
    animation:fadeUp .45s ease;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .office-map{
    margin-top:12px;border-radius:14px;overflow:hidden;
    border:1px solid var(--glass-border);
    background:var(--surface-hover);
    height:200px;width:100%;
  }
  .office-map .leaflet-container{background:var(--surface-hover);font-family:inherit;}
  .office-route-status{
    margin-top:8px;font-size:13px;font-weight:600;color:var(--text-dim);
    min-height:18px;text-align:center;
  }

  /* To'liq ekranli marshrut oynasi */
  .route-overlay{
    position:fixed;inset:0;z-index:70;background:var(--bg-1);
    display:flex;flex-direction:column;animation:storyFadeIn .18s ease;
  }
  .route-overlay-map{
    flex:1 1 52%;min-height:200px;position:relative;
  }
  .route-overlay-map .leaflet-container{
    height:100%;width:100%;font-family:inherit;
  }
  .route-close{
    position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:14px;z-index:500;
    background:rgba(20,20,30,.65);color:#fff;border:none;border-radius:50%;
    width:38px;height:38px;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .route-stats{
    position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:14px;z-index:500;
    background:rgba(20,20,30,.65);color:#fff;border-radius:12px;padding:9px 14px;
    font-size:13px;font-weight:700;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  }
  .route-steps{
    flex:1 1 48%;overflow-y:auto;background:var(--bg-2);
    padding:14px 18px calc(env(safe-area-inset-bottom,0px) + 20px);
    border-top:1px solid var(--glass-border);
  }
  .route-step{
    display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--glass-border);
  }
  .route-step:last-child{border-bottom:none;}
  .route-step-icon{
    width:34px;height:34px;border-radius:50%;background:var(--icon-bg);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;
  }
  .route-step-text{flex:1;font-size:14px;line-height:1.4;color:var(--text);font-weight:600;}
  .route-step-dist{font-size:12px;color:var(--text-dim);margin-top:2px;}
  .route-loading{padding:40px 20px;text-align:center;color:var(--text-dim);font-size:14px;}
  .route-fallback-note{
    font-size:12.5px;color:var(--text-dim);text-align:center;
    padding:8px 10px;margin-bottom:6px;border-radius:10px;
    background:var(--glass);border:1px solid var(--glass-border);
  }

  .footer-note{font-size:12px;color:var(--text-dim);text-align:center;margin-top:14px;line-height:1.5;}
  .footer-note.err{color:var(--accent-red);font-weight:600;}
  .footer-note.ok{color:#3ec27a;font-weight:600;}

  .news-item{
    display:flex;align-items:center;gap:12px;cursor:pointer;
    background:var(--glass);border:1px solid var(--glass-border);
    border-radius:14px;padding:10px 14px;margin-bottom:10px;font-size:14px;line-height:1.45;
  }
  .news-item:active{background:var(--glass-hover);}
  .news-thumb{
    width:44px;height:44px;border-radius:10px;object-fit:cover;flex-shrink:0;
    border:1px solid var(--glass-border);
  }
  .news-thumb-ph{
    display:flex;align-items:center;justify-content:center;background:var(--icon-bg);color:var(--icon);
  }
  .news-thumb-ph svg{width:20px;height:20px;}
  .news-row-text{flex:1;min-width:0;overflow:hidden;}
  .news-row-text .news-date{font-size:11.5px;color:var(--text-dim);margin-bottom:2px;display:block;}

  .admin-row{
    display:flex;align-items:center;gap:10px;background:var(--glass);
    border:1px solid var(--glass-border);border-radius:12px;padding:10px 12px;
    margin-bottom:8px;font-size:13.5px;
  }
  .admin-row .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;}
  .admin-row .del-btn{
    background:var(--accent-red);color:#fff;border:none;border-radius:8px;
    padding:6px 10px;font-size:12px;cursor:pointer;flex-shrink:0;font-family:inherit;
  }
  .admin-row-thumb{
    width:38px;height:38px;border-radius:8px;object-fit:cover;flex-shrink:0;
    border:1px solid var(--glass-border);
  }

  .status-card{
    border-radius:16px;padding:16px;margin-bottom:14px;font-size:14.5px;line-height:1.6;
    border:1px solid var(--glass-border);
  }
  .status-card p{margin:8px 0 0;}
  .status-card-ready{background:rgba(60,200,120,.12);border-color:rgba(60,200,120,.4);}
  .status-card-pending{background:rgba(232,53,79,.1);border-color:rgba(232,53,79,.35);}
  .status-card-new{background:rgba(245,181,46,.1);border-color:rgba(245,181,46,.35);}

  .inapp-warning{
    background:rgba(245,181,46,.12);border:1px solid rgba(245,181,46,.42);
    border-radius:14px;padding:12px 14px;margin-bottom:16px;font-size:13px;line-height:1.55;color:var(--text);
  }

  .story-overlay{
    position:fixed;inset:0;z-index:50;background:#000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    animation:storyFadeIn .2s ease;
  }
  @keyframes storyFadeIn{from{opacity:0;}to{opacity:1;}}
  .story-progress{
    position:absolute;top:14px;left:12px;right:12px;height:3px;
    background:rgba(255,255,255,.25);border-radius:3px;overflow:hidden;z-index:2;
  }
  .story-progress span{display:block;height:100%;width:0;background:#fff;border-radius:3px;transition:width 5s linear;}
  .story-close{
    position:absolute;top:26px;left:14px;z-index:2;background:rgba(255,255,255,.18);
    color:#fff;border:none;border-radius:50%;width:34px;height:34px;font-size:16px;cursor:pointer;
  }
  .story-img{max-width:100%;max-height:76vh;object-fit:contain;}
  .story-noimg{width:76px;height:76px;color:#fff;opacity:.75;}
  .story-noimg svg{width:100%;height:100%;}
  .story-caption{
    color:#fff;font-size:15px;line-height:1.55;text-align:center;
    padding:60px 24px 22px;max-width:520px;
    background:linear-gradient(0deg,rgba(0,0,0,.72),transparent);
    position:absolute;bottom:0;left:0;right:0;
  }

  .fly-plane{
    position:fixed;top:9%;left:-10%;z-index:0;pointer-events:none;
    width:24px;height:24px;color:var(--text);opacity:.28;
    animation:flyAcross 22s linear infinite;
  }
  @keyframes flyAcross{
    0%{transform:translate(0,0) rotate(24deg);opacity:0;}
    10%{opacity:.28;}
    90%{opacity:.28;}
    100%{transform:translate(130vw,48vh) rotate(24deg);opacity:0;}
  }

  .corner-ornament{
    position:fixed;z-index:0;pointer-events:none;
    width:260px;height:260px;color:var(--text);opacity:.05;
  }
  .corner-ornament.tl{top:-72px;left:-72px;}
  .corner-ornament.br{bottom:-72px;right:-72px;transform:rotate(180deg);}

  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-thumb{background:var(--glass-border);border-radius:10px;}
</style>
</head>

function formatRuPhone(raw){
  let d = raw.replace(/\D/g,"");
  if(d.startsWith("8")) d = "7" + d.slice(1);
  if(!d.startsWith("7")) d = "7" + d;
  d = d.slice(0,11);
  const r = d.slice(1);
  let out = "+7";
  if(r.length) out += " " + r.slice(0,3);
  if(r.length >= 4) out += " " + r.slice(3,6);
  if(r.length >= 7) out += "-" + r.slice(6,8);
  if(r.length >= 9) out += "-" + r.slice(8,10);
  return out;
}

/* ================== TARMOQ ================== */
async function request(url, opts, { timeout = 30000, attempts = 2 } = {}){
  let lastErr;
  for(let i = 0; i < attempts; i++){
    const ctrl = new AbortController();
    const timer = setTimeout(()=> ctrl.abort(), timeout);
    try{
      const res = await fetch(url, Object.assign({ cache:"no-store", signal: ctrl.signal }, opts || {}));
      clearTimeout(timer);
      return res;
    }catch(e){
      clearTimeout(timer);
      lastErr = e;
      if(i < attempts - 1) await new Promise(r => setTimeout(r, 500 * (i + 1)));
    }
  }
  throw lastErr;
}

function cacheGet(k, fb){ return store.getJSON("omad_cache_" + k, fb); }
function cacheSet(k, v){ store.setJSON("omad_cache_" + k, v); }

async function kvGet(key, fallback){
  try{
    const res = await request(`/api/kv?key=${key}`, null, { timeout:12000, attempts:2 });
    if(!res.ok) return cacheGet(key, fallback);
    const text = await res.text();
    const parsed = text ? JSON.parse(text) : fallback;
    cacheSet(key, parsed);
    return parsed;
  }catch(e){ return cacheGet(key, fallback); }
}
async function kvSet(key, value){
  cacheSet(key, value);
  try{
    const res = await request(`/api/kv?key=${key}`, {
      method:"PUT", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(value)
    }, { timeout:15000, attempts:3 });
    if(res.ok) return { ok:true, detail:"" };
    const body = await res.text().catch(()=> "");
    return { ok:false, detail:`HTTP ${res.status} ${body}`.slice(0,150) };
  }catch(e){
    return { ok:false, detail:("network: " + (e && e.message ? e.message : e)).slice(0,150) };
  }
}

/* ================== RASM: SIQISH + YUKLASH ================== */
/* Vercel so'rov tanasi ~4.5MB bilan cheklangan, base64 esa hajmni ~33% oshiradi.
   Nishonlangan hajmni ilgarigidan taxminan yarmiga tushirdik — hujjat matni
   hamon aniq o'qiladi, lekin siqish va yuklash sezilarli tezlashadi. */
const TARGET_B64 = 550000;

function loadImage(file){
  return new Promise((resolve, reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{ URL.revokeObjectURL(url); resolve(img); };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); reject(e); };
    img.src = url;
  });
}
function toJpeg(img, maxDim, quality){
  let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  if(Math.max(w,h) > maxDim){
    if(w >= h){ h = Math.round(h * maxDim / w); w = maxDim; }
    else{ w = Math.round(w * maxDim / h); h = maxDim; }
  }
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0,0,w,h);
  ctx.drawImage(img, 0, 0, w, h);
  return c.toDataURL("image/jpeg", quality);
}
async function compressImage(file){
  const img = await loadImage(file);
  const ladder = [[1300,.72],[1100,.68],[950,.6],[800,.52],[650,.46],[500,.4]];
  let out = toJpeg(img, ladder[0][0], ladder[0][1]);
  for(let i = 1; i < ladder.length && out.length > TARGET_B64; i++){
    out = toJpeg(img, ladder[i][0], ladder[i][1]);
  }
  return out;
}
async function uploadBase64(base64){
  let res;
  try{
    res = await request("/api/upload-image", {
      method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ imageBase64: base64 })
    }, { timeout:45000, attempts:2 });
  }catch(e){
    // Fetch o'zi butunlay muvaffaqiyatsiz bo'ldi (masalan internet uzildi,
    // yoki server umuman javob bermadi) — texnik sababini aniq ko'rsatamiz.
    throw new Error("Tarmoq xatosi: " + String(e && e.message || e));
  }
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(res.ok && data && data.url) return data.url;
  const serverMsg = (data && (data.error || data.details)) ? JSON.stringify(data.error || data.details) : null;
  throw new Error(serverMsg || ("Server javobi: HTTP " + res.status));
}

/* Fayl tanlangan zahoti siqish va yuklash boshlanadi — "Yuborish" bosilganda
   kutish bo'lmaydi (yashil ✓ belgisi allaqachon tayyor bo'lib turadi).
   Siqilgan base64 ham keshda saqlanadi — Telegramga jo'natishda uni
   qaytadan siqishga hojat qolmaydi, shu bilan tezlik ta'minlanadi. */
function createUploader(onStatus){
  const u = { file:null, url:null, base64:null, status:"idle", promise:null, error:"" };
  function start(){
    u.status = "working"; u.url = null; u.base64 = null; u.error = "";
    onStatus("working");
    u.promise = (async ()=>{
      let base64;
      try{ base64 = await compressImage(u.file); }
      catch(e){
        base64 = await new Promise((res, rej)=>{
          const r = new FileReader();
          r.onload = ()=> res(r.result); r.onerror = rej; r.readAsDataURL(u.file);
        });
      }
      u.base64 = base64;
      return await uploadBase64(base64);
    })();
    u.promise
      .then(url => { u.url = url; u.status = "done"; onStatus("done"); })
      .catch(e => {
        u.status = "failed";
        u.error = String(e && e.message || e);
        onStatus("failed", u.error);
      });
    return u.promise;
  }
  u.setFile = (file)=>{ u.file = file; start().catch(()=>{}); };
  u.clear = ()=>{ u.file = null; u.url = null; u.base64 = null; u.status = "idle"; u.promise = null; onStatus("idle"); };
  u.retry = ()=>{ if(u.file) start().catch(()=>{}); };
  u.resolve = async ()=>{
    if(!u.file) return null;
    if(u.status === "done") return u.url;
    if(u.status === "working") return await u.promise;
    return await start();
  };
  return u;
}

function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
function calendarInner(mode){
  const y = state.calYear, m = state.calMonth;
  const offset = (new Date(y,m,1).getDay() + 6) % 7;
  const total = daysInMonth(y,m);
  const today = new Date(); today.setHours(0,0,0,0);
  const minDate = mode === "return" && state.date ? state.date : today;
  const selectedDate = mode === "return" ? state.returnDate : state.date;
  let cells = "";
  for(let i=0;i<offset;i++) cells += `<div class="cal-day empty"></div>`;
  for(let d=1; d<=total; d++){
    const dt = new Date(y,m,d);
    const past = dt < minDate;
    const isToday = dt.getTime() === today.getTime();
    const sel = selectedDate && selectedDate.getFullYear()===y && selectedDate.getMonth()===m && selectedDate.getDate()===d;
    cells += `<div class="cal-day${past?' past':''}${isToday?' today':''}${sel?' selected':''}" data-day="${d}">${d}</div>`;
  }
  const dow = t('dow').map(d => `<div class="cal-dow">${d}</div>`).join("");
  return `<div class="cal-head">
      <button class="cal-nav-btn" id="prevMonth" aria-label="prev">‹</button>
      <div class="cal-month-label">${t('mon')[m]} ${y}</div>
      <button class="cal-nav-btn" id="nextMonth" aria-label="next">›</button>
    </div>
    <div class="cal-grid">${dow}${cells}</div>`;
}
function calendarScreen(opts){
  const mode = (opts && opts.mode) || "departure";

  const lines = [
    "Omad Tour",
    `${t('from')}: ${from}`,
    `${t('to')}: ${to}`,
    `${t('date')}: ${d}`,
    `${t('tripTypeLabel')}: ${state.tripType === "roundtrip" ? t('roundTripText') : t('oneWayText')}`
  ];
  if(state.tripType === "roundtrip" && state.returnDate){
    lines.push(`${t('returnDate')}: ${state.returnDate.getDate()} ${t('mon')[state.returnDate.getMonth()]} ${state.returnDate.getFullYear()}`);
  }
  const p = state.passengers;
  const paxParts = [`${t('adultsLabel')}: ${p.adults}`];
  // Bu yerda ataylab tarjima qilinmagan "Child"/"Inf" ishlatiladi — ekranda
  // mijozga "Bolalar"/"Chaqaloqlar" ko'rinadi, lekin sizga (agentga)

  if(p.children > 0) paxParts.push(`Child: ${p.children}`);

  lines.push(`${t('passengersSummary')}: ${paxParts.join(", ")}`);
  return lines.join("\n");
}

function initOfficeMap(id, coords){
  if(typeof L === "undefined") return null;
  ensureLeafletDefaultIcon();
  const el = document.getElementById("map-" + id);
  if(!el || el._leaflet_id) return officeMaps[id] || null;

  const map = L.map(el, { attributionControl: false, zoomControl:false, dragging:false, scrollWheelZoom:false, tap:false })
    .setView([coords.lat, coords.lng], 15);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19, attribution: "&copy; OpenStreetMap"
  }).addTo(map);
  L.control.attribution({ prefix: false }).addAttribution("© OpenStreetMap").addTo(map);
  L.marker([coords.lat, coords.lng]).addTo(map);

  officeMaps[id] = map;
  return map;
}

/* ---- Ko'chama (maneuver) turini o'qish uchun qulay belgi va matn ---- */
function segmentIcon(type){
  if(type === "walk") return "🚶";
  if(type === "transport") return "🚌";
  if(type === "transfer") return "🔄";
  if(type === "wait") return "⏳";
  return "•";
}
function segmentLabel(type){
  if(type === "walk") return t('routeWalk');
  if(type === "transfer") return t('routeTransferAt');
  if(type === "wait") return t('routeWait');
  return t('routeTransport');
}

/* To'liq ekranli marshrut oynasi — xarita kattalashadi, HAQIQIY jamoat
   transporti (avtobus/tramvay/metro) va peresadkalar ko'rsatiladi (Yandex
   Maps API — Sankt-Peterburg uchun eng to'liq transport ma'lumotlari).
   Yuqori chapdagi ✕ tugmasi bosilganda hammasi o'z holiga qaytadi. */
function openRouteOverlay(id, coords){
  const overlay = document.createElement("div");
  overlay.className = "route-overlay";
  overlay.innerHTML = `
    <div class="route-overlay-map" id="route-map-${id}">
      <button type="button" class="route-close" id="route-close-btn" aria-label="close">✕</button>
      <div class="route-stats" id="route-stats-${id}" style="display:none"></div>
    </div>
    <div class="route-steps" id="route-steps-${id}">
      <div class="route-loading">${esc(t('locatingYou'))}</div>
    </div>`;
  document.body.appendChild(overlay);

  let yMap = null;
  document.getElementById("route-close-btn").addEventListener("click", ()=>{
    if(yMap) yMap.destroy();
    overlay.remove();
  });

  if(typeof ymaps === "undefined" || !navigator.geolocation){
    document.getElementById("route-steps-" + id).innerHTML = `<div class="route-loading">${esc(t('locationError'))}</div>`;
    return;
  }

  function renderSegments(activeRoute, stepsBox, statsEl){
    statsEl.textContent = activeRoute.properties.get("duration").text;
    statsEl.style.display = "block";
    let stepsHtml = "";
    activeRoute.getPaths().each(function(path){
      path.getSegments().each(function(segment){
        const segType = segment.properties.get("type");
        const distObj = segment.properties.get("distance");
        const durObj = segment.properties.get("duration");
        const mainText = segment.properties.get("text") || segmentLabel(segType);
        const metaParts = [];
        if(distObj && distObj.text) metaParts.push(distObj.text);
        if(durObj && durObj.text) metaParts.push(durObj.text);
        stepsHtml += `<div class="route-step">
          <span class="route-step-icon">${segmentIcon(segType)}</span>
          <div>
            <div class="route-step-text">${esc(mainText)}</div>
            ${metaParts.length ? `<div class="route-step-dist">${esc(metaParts.join(" · "))}</div>` : ""}
          </div>
        </div>`;
      });
    });
    stepsBox.innerHTML = stepsHtml;
    return !!stepsHtml;
  }

  // Jamoat transporti marshruti topilmasa (masalan masofa juda qisqa bo'lsa,
  // yoki shu yo'nalish uchun umuman transport tavsiya etilmasa), avtomatik
  // piyoda marshrutiga o'tamiz — shunda foydalanuvchi baribir bo'sh
  // ekran o'rniga foydali natija ko'radi.
  function tryPedestrianFallback(uLat, uLng, stepsBox, statsEl){
    const pedestrianRoute = new ymaps.multiRouter.MultiRoute({
      referencePoints: [[uLat, uLng], [coords.lat, coords.lng]],
      params: { routingMode: "pedestrian" }
    }, { boundsAutoApply: true });
    yMap.geoObjects.add(pedestrianRoute);

    pedestrianRoute.model.events.add("requestsuccess", function(){
      const activeRoute = pedestrianRoute.getActiveRoute();
      if(!activeRoute || !renderSegments(activeRoute, stepsBox, statsEl)){
        stepsBox.innerHTML = `<div class="route-loading">${esc(t('noTransitRoute'))}</div>`;
      }else{
        stepsBox.insertAdjacentHTML("afterbegin", `<div class="route-fallback-note">🚶 ${esc(t('pedestrianFallbackNote'))}</div>`);
      }
    });
    pedestrianRoute.model.events.add("requestfail", function(){
      stepsBox.innerHTML = `<div class="route-loading">${esc(t('noTransitRoute'))}</div>`;
    });
  }

  navigator.geolocation.getCurrentPosition((pos)=>{
    const uLat = pos.coords.latitude, uLng = pos.coords.longitude;
    const stepsBox = document.getElementById("route-steps-" + id);
    stepsBox.innerHTML = `<div class="route-loading">${esc(t('buildingRoute'))}</div>`;

    ymaps.ready(function(){
      yMap = new ymaps.Map("route-map-" + id, {
        center: [coords.lat, coords.lng],
        zoom: 13,
        controls: ["zoomControl"]
      });

      const statsEl = document.getElementById("route-stats-" + id);
      const multiRoute = new ymaps.multiRouter.MultiRoute({
        referencePoints: [[uLat, uLng], [coords.lat, coords.lng]],
        params: { routingMode: "masstransit" }
      }, {
        boundsAutoApply: true,
        wayPointStartIconColor: "#3b82f6",
        wayPointFinishIconColor: "#e8354f"
      });
      yMap.geoObjects.add(multiRoute);

      multiRoute.model.events.add("requestsuccess", function(){
        const activeRoute = multiRoute.getActiveRoute();
        if(!activeRoute || !renderSegments(activeRoute, stepsBox, statsEl)){
          yMap.geoObjects.remove(multiRoute);
          tryPedestrianFallback(uLat, uLng, stepsBox, statsEl);
        }
      });

      multiRoute.model.events.add("requestfail", function(){
        yMap.geoObjects.remove(multiRoute);
        tryPedestrianFallback(uLat, uLng, stepsBox, statsEl);
      });
    });
  }, ()=>{
    document.getElementById("route-steps-" + id).innerHTML = `<div class="route-loading">${esc(t('locationError'))}</div>`;
  }, { enableHighAccuracy:true, timeout:10000 });
}

function bind(name, opts){

      const r = btn.getBoundingClientRect();
      const size = Math.max(r.width, r.height);
      const el = document.createElement("span");
      el.className = "ripple";
      el.style.width = el.style.height = size + "px";
      el.style.left = (e.clientX - r.left - size/2) + "px";
      el.style.top  = (e.clientY - r.top  - size/2) + "px";
      btn.appendChild(el);
      setTimeout(()=> el.remove(), 600);
    });

/* Fayl tanlash + fon rejimida yuklash */
function wireDropzone(prefix){
  const input = document.getElementById(prefix + "File");
  const box = document.getElementById(prefix + "Box");
  const empty = document.getElementById(prefix + "Empty");
  const preview = document.getElementById(prefix + "Preview");
  const thumb = document.getElementById(prefix + "Thumb");
  const nameEl = document.getElementById(prefix + "Name");
  const meta = document.getElementById(prefix + "Meta");
  const detail = document.getElementById(prefix + "Detail");
  const bar = document.getElementById(prefix + "Bar");
  const remove = document.getElementById(prefix + "Remove");
  const err = document.getElementById(prefix + "FileErr");

  const uploader = createUploader((status, errorMsg)=>{
    box.classList.remove("ready","failed");
    meta.classList.remove("ok","err");
    detail.style.display = "none";
    if(status === "working"){ meta.textContent = t('photoUploading'); bar.style.width = "65%"; }
    else if(status === "done"){ meta.textContent = t('photoReady'); meta.classList.add("ok"); bar.style.width = "100%"; box.classList.add("ready"); }
    else if(status === "failed"){
      meta.textContent = t('photoFailed');
      meta.classList.add("err");
      bar.style.width = "0";
      box.classList.add("failed");
      // Xatolikning aniq sababini ko'rsatamiz — "ishlamadi" deyish o'rniga
      // NEGA ishlamaganini ko'rish orqali muammoni tezda topib bo'ladi.
      if(errorMsg){
        detail.textContent = errorMsg;
        detail.style.display = "block";
      }
    }
    else { bar.style.width = "0"; }
  });

  function show(file){
    const r = new FileReader();
    r.onload = e => { thumb.src = e.target.result; };
    r.readAsDataURL(file);
    nameEl.textContent = file.name;
    meta.textContent = t('photoPreparing');
    empty.style.display = "none";
    preview.style.display = "flex";
    if(err) err.style.display = "none";
  }

  box.addEventListener("click", e=>{
    if(e.target === remove) return;
    if(uploader.status === "failed"){ uploader.retry(); return; }
    input.click();
  });
  input.addEventListener("change", ()=>{
    const f = input.files[0];
    if(!f) return;
    show(f);
    uploader.setFile(f);
  });
  remove.addEventListener("click", e=>{
    e.stopPropagation();
    input.value = "";
    empty.style.display = "flex";
    preview.style.display = "none";
    thumb.removeAttribute("src");
    box.classList.remove("ready","failed");
    uploader.clear();
  });
  return uploader;
}

function bindVizaForm(){
  const up = wireDropzone("viza");
  const phone = document.getElementById("vizaPhone");
  phone.value = "+7 ";
  phone.addEventListener("input", ()=>{ phone.value = formatRuPhone(phone.value); });
  phone.addEventListener("focus", ()=>{
    setTimeout(()=> phone.setSelectionRange(phone.value.length, phone.value.length), 0);
  });

  const btn = document.getElementById("vizaSubmit");
  const status = document.getElementById("vizaStatus");
  let busy = false;

  btn.addEventListener("click", async ()=>{
    if(busy) return;
    const digits = phone.value.replace(/\D/g,"");
    const phoneOk = digits.length === 11 && digits.startsWith("7");
    const hasFile = !!up.file;
    document.getElementById("vizaPhoneErr").style.display = phoneOk ? "none" : "block";
    document.getElementById("vizaFileErr").style.display = hasFile ? "none" : "block";
    if(!phoneOk || !hasFile) return;

    busy = true;
    btn.disabled = true;
    btn.textContent = t('sending');
    status.className = "footer-note";
    status.textContent = up.status === "done" ? "" : t('photoUploading');

    try{
      // Rasm allaqachon fayl tanlangan zahoti yuklana boshlagan — odatda bu yerda
      // darhol tayyor turadi (yashil ✓). Agar hali tugamagan bo'lsa, shu yerda kutamiz.
      const url = await up.resolve();
      const phoneVal = phone.value.trim();
      const id = Date.now();

      // Ma'lumotlar bazasiga saqlash (asosiy, majburiy) va Telegramga bildirishnoma
      // (rasm baytlari to'g'ridan-to'g'ri, havola orqali emas) bir vaqtda ketadi —
      // shu tufayli "birinchisi yo'qoladi" degan poyga holati endi bo'lmaydi.
      const [visaResult, notified] = await Promise.all([
        addVisa(phoneVal, url, id),
        notifyTelegramVisa(up.base64, phoneVal, id)
      ]);

      if(!visaResult.saved){
        throw new Error(visaResult.detail || "save failed");
      }
      addMyVisaId(id);
      if(!notified){
        // So'rov saqlandi — bu asosiysi. Telegram bildirishnomasi serverda
        // qayta urinib ko'rilgan va oxirida hech bo'lmasa matnli ogohlantirish
        // yuborilgan bo'lishi kerak, shu sabab foydalanuvchiga xato ko'rsatmaymiz.
        console.warn("Telegram notification did not confirm delivery for visa #" + id);
      }
      status.className = "footer-note ok";
      status.textContent = t('submitSuccess');
      setTimeout(home, 1500);
    }catch(e){
      status.className = "footer-note err";
      status.textContent = t('submitFail');
      btn.disabled = false;
      btn.textContent = t('send');
      busy = false;
    }
  });
}

  btn.addEventListener("click", async ()=>{
    const val = document.getElementById("helpInput").value.trim();
    if(!val){ document.getElementById("helpErr").style.display = "block"; return; }
    let body = val;
    if(up.file){
      btn.disabled = true; btn.textContent = t('sending');
      try{
        const url = await up.resolve();
        body += `\n\n${t('attachedImage')}: ${url}`;
      }catch(e){
        status.className = "footer-note err";
        status.textContent = t('submitFail');
      }
      btn.disabled = false; btn.textContent = t('send');
    }
    location.href = `mailto:${HELP_EMAIL}?subject=${encodeURIComponent("Omad Tour — " + t('yordam'))}&body=${encodeURIComponent(body)}`;
  });
}

function bindNews(){
  fetchNews().then(list=>{
    setNewsSeen(list.length);
    store.set("omad_news_count", String(list.length));
    const box = document.getElementById("newsBox");
    if(!box) return;
    if(!list.length){ box.innerHTML = `<div class="footer-note">${esc(t('noNews'))}</div>`; return; }
    box.innerHTML = list.map((n,i)=>`<div class="news-item" data-idx="${i}">
      ${n.imageUrl ? `<img class="news-thumb" src="${esc(n.imageUrl)}" alt="">` : `<span class="news-thumb news-thumb-ph">${ICONS.megaphone}</span>`}
      <div class="news-row-text"><span class="news-date">${esc(n.date)}</span>${esc(n.text)}</div>
    </div>`).join("");
    box.querySelectorAll("[data-idx]").forEach(el=>{
      el.addEventListener("click", ()=> showStory(list[parseInt(el.dataset.idx,10)]));
    });
  });
}

function showStory(item){
  const ov = document.createElement("div");
  ov.className = "story-overlay";
  ov.innerHTML = `<div class="story-progress"><span id="storyBar"></span></div>
    <button class="story-close" id="storyClose" aria-label="close">✕</button>
    ${item.imageUrl ? `<img class="story-img" src="${esc(item.imageUrl)}" alt="">` : `<div class="story-noimg">${ICONS.megaphone}</div>`}
    <div class="story-caption">${esc(item.text)}</div>`;
  document.body.appendChild(ov);
  requestAnimationFrame(()=>{ const b = document.getElementById("storyBar"); if(b) b.style.width = "100%"; });
  const tm = setTimeout(()=> ov.remove(), 5000);
  document.getElementById("storyClose").addEventListener("click", ()=>{ clearTimeout(tm); ov.remove(); });
}

function bindAdmin(){
  const up = wireDropzone("news");

  function renderList(){
    fetchNews().then(list=>{
      const box = document.getElementById("adminNews");
      if(!box) return;
      if(!list.length){ box.innerHTML = `<div class="footer-note">${esc(t('noNews'))}</div>`; return; }
      box.innerHTML = list.map(n=>`<div class="admin-row">
        ${n.imageUrl ? `<img class="admin-row-thumb" src="${esc(n.imageUrl)}" alt="">` : ""}
        <span class="grow"><b>${esc(n.date)}</b> — ${esc(n.text)}</span>
        <button class="del-btn" data-id="${n.id}">O'chirish</button>
      </div>`).join("");
      box.querySelectorAll("[data-id]").forEach(b=>{
        b.addEventListener("click", async ()=>{
          b.textContent = "…";
          await deleteNews(parseInt(b.dataset.id,10));
          renderList();
        });
      });
    });
  }
  renderList();

  document.getElementById("newsAdd").addEventListener("click", async ()=>{
    const input = document.getElementById("newsInput");
    const status = document.getElementById("newsAddStatus");
    const val = input.value.trim();
    if(!val) return;
    const btn = document.getElementById("newsAdd");
    btn.disabled = true; btn.textContent = "Qo'shilmoqda…";
    status.className = "footer-note"; status.textContent = "";
    let imageUrl = "";
    try{ if(up.file) imageUrl = await up.resolve(); }
    catch(e){ status.className = "footer-note err"; status.textContent = "Rasm yuklanmadi — matn rasmsiz saqlandi."; }
    const r = await addNews(val, imageUrl);
    if(!r.ok){ status.className = "footer-note err"; status.textContent = "Saqlanmadi: " + r.detail; }
    input.value = "";
    document.getElementById("newsRemove").click();
    btn.disabled = false; btn.textContent = "Yangilik qo'shish";
    renderList();
  });

  document.getElementById("resetVisa").addEventListener("click", async ()=>{
    if(!confirm("Barcha viza so'rovlari o'chiriladi. Davom etasizmi?")) return;
    const btn = document.getElementById("resetVisa");
    const status = document.getElementById("resetStatus");
    btn.disabled = true; btn.textContent = "Tozalanmoqda…";
    const r = await kvSet("visa_submissions", []);
    status.className = "footer-note " + (r.ok ? "ok" : "err");
    status.textContent = r.ok ? "Tozalandi." : "Xatolik: " + r.detail;
    btn.disabled = false; btn.textContent = "Viza so'rovlarini tozalash";
  });
}

/* ================== FON ANIMATSIYASI ================== */
(function(){
  const canvas = document.getElementById("dots-canvas");
  const ctx = canvas.getContext("2d");
  const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, dots = [];
  function resize(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  function init(){
    dots = [];
    const n = Math.min(90, Math.floor((w*h)/14000));
    for(let i=0;i<n;i++){
      dots.push({
        x:Math.random()*w, y:Math.random()*h, r:Math.random()*1.4+0.4,
        vx:(Math.random()-0.5)*0.18, vy:(Math.random()-0.5)*0.18,
        a:Math.random()*0.4+0.12
      });
    }
  }
  function tick(){
    ctx.clearRect(0,0,w,h);
    const light = document.body.classList.contains("theme-light");
    for(const d of dots){
      d.x += d.vx; d.y += d.vy;
      if(d.x < 0) d.x = w; if(d.x > w) d.x = 0;
      if(d.y < 0) d.y = h; if(d.y > h) d.y = 0;
      ctx.beginPath();
      ctx.arc(d.x, d.y, d.r, 0, Math.PI*2);
      ctx.fillStyle = light ? `rgba(12,28,77,${d.a*0.5})` : `rgba(255,255,255,${d.a})`;
      ctx.fill();
    }
    if(!reduce) requestAnimationFrame(tick);
  }
  window.addEventListener("resize", ()=>{ resize(); init(); });
  resize(); init(); tick();
})();
